name: Daily Cron Monitor (auto-rescue missing slots)

# 매시간 30분에 발화 → 4개 슬롯 전부 검사 → 발행 시각이 지났는데
# 아직 main에 없는 슬롯은 즉시 rescue 발화.
#
# 이전 버전은 각 슬롯별 정확한 시각 +30분에 1번만 발화했음. 그 발화
# 자체가 GitHub Actions 트래픽으로 누락되면 보충 메커니즘 없음 →
# 5/21 kr-close 누락 사건처럼 1시간+ 지연돼도 자동 복구 불가.
#
# 새 설계: 24시간 매시간 발화. 각 슬롯의 "발행 마감 시각"이 지났는데
# 글이 없으면 발화. 이미 있으면 skip. 한 슬롯의 monitor cron이 누락
# 돼도 다음 시간 monitor가 catch.
#
# 슬롯별 발행 마감 시각 (KST):
#   us-close:     07:00 (06:00 발화 + 60min 유예)
#   kr-open:      08:30 (07:30 + 60min)
#   kr-close:     17:00 (15:45 + 75min)
#   us-premarket: 22:30 (21:30 + 60min)

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"   # 매시간 30분에 발화

permissions:
  contents: read
  actions: write

jobs:
  monitor:
    name: Check all 4 slots, rescue missing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute today's expected slugs (KST)
        id: dates
        run: |
          publish_date=$(TZ=Asia/Seoul date +%Y-%m-%d)
          trading_date_us_close=$(TZ=Asia/Seoul date -d "yesterday" +%Y-%m-%d)
          hour_kst=$(TZ=Asia/Seoul date +%H)
          echo "publish_date=$publish_date" >> "$GITHUB_OUTPUT"
          echo "trading_date_us_close=$trading_date_us_close" >> "$GITHUB_OUTPUT"
          echo "hour_kst=$hour_kst" >> "$GITHUB_OUTPUT"
          echo "now KST: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M %Z')"
          echo "publish_date=$publish_date, us-close trading_date=$trading_date_us_close, hour_kst=$hour_kst"

      - name: Check & rescue us-close (deadline KST 07:00)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          slug="us-tech-recap-${{ steps.dates.outputs.trading_date_us_close }}"
          hour=${{ steps.dates.outputs.hour_kst }}
          if [ -d "public/blog/$slug" ]; then
            echo "::notice::✅ $slug exists — skipping"
            exit 0
          fi
          if [ "$hour" -lt 7 ] || [ "$hour" -gt 23 ]; then
            echo "::notice::⏳ $slug missing but pre-deadline (KST $hour < 07) — skipping"
            exit 0
          fi
          echo "::warning::⚠️ $slug missing past deadline — triggering rescue"
          gh workflow run daily-cron.yml -f slot=us-close

      - name: Check & rescue kr-open (deadline KST 08:30)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          slug="kr-open-brief-${{ steps.dates.outputs.publish_date }}"
          hour=${{ steps.dates.outputs.hour_kst }}
          if [ -d "public/blog/$slug" ]; then
            echo "::notice::✅ $slug exists — skipping"
            exit 0
          fi
          if [ "$hour" -lt 8 ] || [ "$hour" -gt 23 ]; then
            echo "::notice::⏳ $slug missing but pre-deadline (KST $hour < 08) — skipping"
            exit 0
          fi
          echo "::warning::⚠️ $slug missing past deadline — triggering rescue"
          gh workflow run daily-cron.yml -f slot=kr-open

      - name: Check & rescue kr-close (deadline KST 17:00)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          slug="kr-tech-recap-${{ steps.dates.outputs.publish_date }}"
          hour=${{ steps.dates.outputs.hour_kst }}
          if [ -d "public/blog/$slug" ]; then
            echo "::notice::✅ $slug exists — skipping"
            exit 0
          fi
          if [ "$hour" -lt 17 ] || [ "$hour" -gt 23 ]; then
            echo "::notice::⏳ $slug missing but pre-deadline (KST $hour < 17) — skipping"
            exit 0
          fi
          echo "::warning::⚠️ $slug missing past deadline — triggering rescue"
          gh workflow run daily-cron.yml -f slot=kr-close

      - name: Check & rescue us-premarket (deadline KST 22:30)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          slug="us-premarket-${{ steps.dates.outputs.publish_date }}"
          hour=${{ steps.dates.outputs.hour_kst }}
          if [ -d "public/blog/$slug" ]; then
            echo "::notice::✅ $slug exists — skipping"
            exit 0
          fi
          # us-premarket deadline 22:30 — only check at hour >= 23
          if [ "$hour" -lt 23 ]; then
            echo "::notice::⏳ $slug missing but pre-deadline (KST $hour < 23) — skipping"
            exit 0
          fi
          echo "::warning::⚠️ $slug missing past deadline — triggering rescue"
          gh workflow run daily-cron.yml -f slot=us-premarket
