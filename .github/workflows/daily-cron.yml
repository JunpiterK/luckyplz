name: Daily Market Posts (6 slots)

# Cron는 UTC 기준이다. 시각 설계 원칙:
#   - 마감 슬롯: 시장 마감 +5~30분 (yfinance 데이터 안정 후 가능한 빨리)
#   - 개장 슬롯: 시장 개장 -2시간 (GH Actions free tier 지연 0~60분 +
#                Claude 호출 ~5분 마진 후도 개장 1시간 전 발행 완료 보장)
#   - us-premarket 만 -1시간 (KST 22:30 = ET 08:30 매크로 발표 시점에
#                              발화하는 게 슬롯의 핵심 가치라 그대로 유지)
#
# 2026-05-27 update — GitHub Actions schedule drift 완화:
#   GitHub 공식 문서는 정시(0분)/반시(30분) 같은 hot minute 에 cron 이
#   몰리면 "delayed during high loads ... some queued jobs may be dropped"
#   라고 명시한다. 5/27 kr-open (0 22) 이 정확히 :00 핫스팟이라 UTC 23:03
#   까지 ~63분 지연된 사례를 본 직후라, 모든 슬롯을 :00/:30 에서 7~13분
#   오프셋으로 이동. 시장-의미 윈도우 (마감 +5~30분 / 개장 -2시간 / 매크로
#   발표 +몇 분) 는 그대로 유지.
#
#   KST 04:27 = UTC 19:27 (전날)   ← ① US 마감 리캡 (마감 04:00 + 27분, was :30)
#   KST 07:13 = UTC 22:13 (전날)   ← ② 한국 개장 브리핑 (개장 09:00 -107분, was :00 ★ primary fix)
#   KST 08:37 = UTC 23:37 (전날)   ← ⑤ 중국 개장 브리핑 (개장 10:30 -113분, was :30)
#   KST 15:38 = UTC 06:38          ← ③ 한국 마감 리캡 (마감 15:30 +8분, was :35)
#   KST 16:08 = UTC 07:08          ← ⑥ 중국 마감 리캡 (마감 16:00 +8분, was :05)
#   KST 21:33 = UTC 12:33          ← ④ 미국 프리마켓 (ET 08:30 매크로 +3분, was :30 ★ secondary fix)

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to run (us-close | kr-open | kr-close | us-premarket | cn-open | cn-close | all)"
        required: true
        default: "all"
      date:
        description: "Override KST publish date YYYY-MM-DD (optional)"
        required: false
        default: ""
      force:
        description: "Re-publish even if slug already exists (true/false)"
        required: false
        default: "false"
  # 2026-06-26: 게임 전문 사이트로 전환하며 증시 자동발행 스케줄 비활성화.
  # 콘텐츠 코드는 다른 사이트 재활용을 위해 보존하고 스케줄만 껐다.
  # 필요 시 Actions → Run workflow (workflow_dispatch) 로 수동 실행 가능.
  # schedule:
  #   - cron: "27 19 * * *"    # ① us-close   (04:27 KST = US 마감 04:00 + 27분)
  #   - cron: "13 22 * * *"    # ② kr-open    (07:13 KST = KOSPI 개장 09:00 -107분)
  #   - cron: "37 23 * * *"    # ⑤ cn-open    (08:37 KST = SSE 개장 10:30 -113분)
  #   - cron: "38 6 * * *"     # ③ kr-close   (15:38 KST = KOSPI 마감 15:30 +8분)
  #   - cron: "8 7 * * *"      # ⑥ cn-close   (16:08 KST = SSE 마감 16:00 +8분)
  #   - cron: "33 12 * * *"    # ④ us-pre     (21:33 KST = ET 08:30 매크로 +3분)

permissions:
  contents: write

jobs:
  resolve-slot:
    name: Resolve slot from schedule
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.pick.outputs.slot }}
    steps:
      - id: pick
        run: |
          # Manual dispatch: respect input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled run: pick by cron line. Each line must match exactly
          # one of the schedule: entries above.
          case "${{ github.event.schedule }}" in
            "27 19 * * *")  echo "slot=us-close" >> "$GITHUB_OUTPUT" ;;
            "13 22 * * *")  echo "slot=kr-open" >> "$GITHUB_OUTPUT" ;;
            "37 23 * * *")  echo "slot=cn-open" >> "$GITHUB_OUTPUT" ;;
            "38 6 * * *")   echo "slot=kr-close" >> "$GITHUB_OUTPUT" ;;
            "8 7 * * *")    echo "slot=cn-close" >> "$GITHUB_OUTPUT" ;;
            "33 12 * * *")  echo "slot=us-premarket" >> "$GITHUB_OUTPUT" ;;
            *)              echo "slot=us-close" >> "$GITHUB_OUTPUT" ;;
          esac

  run-slot:
    needs: resolve-slot
    name: Publish ${{ needs.resolve-slot.outputs.slot }}
    runs-on: ubuntu-latest
    if: needs.resolve-slot.outputs.slot != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Need write token for git push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install fonts (CJK + Nanum + DejaVu fallback)
        run: |
          sudo apt-get update -y
          # fonts-nanum: Korean-only TTF (NanumGothic/NanumGothicBold) — most
          #   reliable for OG image rendering. Pillow doesn't always pick the
          #   correct face from Noto CJK TTC collections.
          # fonts-noto-cjk: full CJK TTC collection (KR + JP + SC + TC bundled)
          # fonts-noto-cjk-extra: per-language single-face OTFs (NotoSansCJKjp-
          #   Bold.otf, NotoSansCJKsc-Bold.otf, etc.). This is what makes ja/zh
          #   OG images render reliably without TTC face-selection ambiguity.
          # fonts-dejavu: Latin-only fallback
          sudo apt-get install -y fonts-nanum fonts-noto-cjk fonts-noto-cjk-extra fonts-dejavu
          # Verify install — should show Nanum + Noto CJK + per-lang OTFs
          fc-list | grep -iE "nanum|noto.*cjk" | head -12 || echo "(font listing failed but install ran)"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config --global user.name "luckyplz-bot"
          git config --global user.email "noreply@anthropic.com"

      - name: Run pipeline (single slot)
        if: needs.resolve-slot.outputs.slot != 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LP_GIT_PUSH: "1"
          # Healthchecks.io per-slot ping URLs (optional — empty = silent no-op
          # inside the script). Set each as a repo secret on GitHub:
          #   Settings → Secrets and variables → Actions → New repository secret
          # The value is the full hc-ping.com URL copied from the Healthchecks
          # dashboard for that check. Creating these is a one-time operator
          # action; until then the publish pipeline ignores them.
          HC_URL_US_CLOSE:     ${{ secrets.HC_URL_US_CLOSE }}
          HC_URL_KR_OPEN:      ${{ secrets.HC_URL_KR_OPEN }}
          HC_URL_CN_OPEN:      ${{ secrets.HC_URL_CN_OPEN }}
          HC_URL_KR_CLOSE:     ${{ secrets.HC_URL_KR_CLOSE }}
          HC_URL_CN_CLOSE:     ${{ secrets.HC_URL_CN_CLOSE }}
          HC_URL_US_PREMARKET: ${{ secrets.HC_URL_US_PREMARKET }}
          # Discord webhook for inline alerts on degraded publish / pipeline
          # failure. Single channel for all slots — clean enough to operate
          # from a phone. Same one-time setup pattern as HC_URL_*.
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          FORCE_ARG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python scripts/auto-daily-post.py --slot ${{ needs.resolve-slot.outputs.slot }} $DATE_ARG $FORCE_ARG

      - name: Run pipeline (all 6 slots)
        if: needs.resolve-slot.outputs.slot == 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LP_GIT_PUSH: "1"
          HC_URL_US_CLOSE:     ${{ secrets.HC_URL_US_CLOSE }}
          HC_URL_KR_OPEN:      ${{ secrets.HC_URL_KR_OPEN }}
          HC_URL_CN_OPEN:      ${{ secrets.HC_URL_CN_OPEN }}
          HC_URL_KR_CLOSE:     ${{ secrets.HC_URL_KR_CLOSE }}
          HC_URL_CN_CLOSE:     ${{ secrets.HC_URL_CN_CLOSE }}
          HC_URL_US_PREMARKET: ${{ secrets.HC_URL_US_PREMARKET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          for SLOT in us-close kr-open cn-open kr-close cn-close us-premarket; do
            echo "=== Running $SLOT ==="
            python scripts/auto-daily-post.py --slot "$SLOT" || echo "[warn] $SLOT failed; continuing"
            sleep 5
          done
