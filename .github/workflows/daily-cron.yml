name: Daily Market Posts (4 slots)

# Cron는 UTC 기준이다.
#   KST 06:00 = UTC 21:00 (전날)   ← ① US 마감 리캡 (US session closed at 04:00 KST)
#   KST 07:30 = UTC 22:30 (전날)   ← ② 한국 개장 브리핑 (09:00 KOSPI open D-day)
#   KST 15:45 = UTC 06:45          ← ③ 한국 마감 리캡
#   KST 21:30 = UTC 12:30          ← ④ 미국 프리마켓 브리핑

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot to run (us-close | kr-open | kr-close | us-premarket | all)"
        required: true
        default: "all"
      date:
        description: "Override KST publish date YYYY-MM-DD (optional)"
        required: false
        default: ""
  schedule:
    - cron: "0 21 * * *"     # ① us-close   (06:00 KST)
    - cron: "30 22 * * *"    # ② kr-open    (07:30 KST)
    - cron: "45 6 * * *"     # ③ kr-close   (15:45 KST)
    - cron: "30 12 * * *"    # ④ us-pre     (21:30 KST)

permissions:
  contents: write

jobs:
  resolve-slot:
    name: Resolve slot from schedule
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.pick.outputs.slot }}
    steps:
      - id: pick
        run: |
          # Manual dispatch: respect input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Scheduled run: pick by cron line
          case "${{ github.event.schedule }}" in
            "0 21 * * *")   echo "slot=us-close" >> "$GITHUB_OUTPUT" ;;
            "30 22 * * *")  echo "slot=kr-open" >> "$GITHUB_OUTPUT" ;;
            "45 6 * * *")   echo "slot=kr-close" >> "$GITHUB_OUTPUT" ;;
            "30 12 * * *")  echo "slot=us-premarket" >> "$GITHUB_OUTPUT" ;;
            *)              echo "slot=us-close" >> "$GITHUB_OUTPUT" ;;
          esac

  run-slot:
    needs: resolve-slot
    name: Publish ${{ needs.resolve-slot.outputs.slot }}
    runs-on: ubuntu-latest
    if: needs.resolve-slot.outputs.slot != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Need write token for git push
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install fonts (CJK + DejaVu fallback)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu fonts-noto-cjk

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config --global user.name "luckyplz-bot"
          git config --global user.email "noreply@anthropic.com"

      - name: Run pipeline (single slot)
        if: needs.resolve-slot.outputs.slot != 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LP_GIT_PUSH: "1"
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          python scripts/auto-daily-post.py --slot ${{ needs.resolve-slot.outputs.slot }} $DATE_ARG

      - name: Run pipeline (all 4 slots)
        if: needs.resolve-slot.outputs.slot == 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LP_GIT_PUSH: "1"
        run: |
          for SLOT in us-close kr-open kr-close us-premarket; do
            echo "=== Running $SLOT ==="
            python scripts/auto-daily-post.py --slot "$SLOT" || echo "[warn] $SLOT failed; continuing"
            sleep 5
          done
