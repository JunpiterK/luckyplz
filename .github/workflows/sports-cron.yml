name: Daily Sports Posts (football + baseball)

# Cron는 UTC 기준. 슬롯 설계:
#   - football-daily (라리가 + EPL): 유럽 경기는 전날 밤 CET 에 끝난다.
#     KST 아침에 "어제(KST) 경기"를 커버. 발행 10:20 KST = 01:20 UTC.
#     football-data.org 매치 데이터는 UTC date 로 묶이므로 target=yesterday-KST.
#   - baseball-daily (MLB): 미국 야간 경기는 다음날 새벽 UTC 에 끝난다.
#     서부(다저스) 경기까지 Final 보장되도록 17:50 KST = 08:50 UTC 발행.
#     target = yesterday-KST (= 직전 US 경기일 슬레이트).
#
# 기존 증시 cron(19:27 / 22:13 / 23:37 / 06:38 / 07:08 / 12:33 UTC) 와
# 겹치지 않는 윈도우(:20 / :50)로 배치 — GitHub abuse 윈도우·hot-minute 회피.
#
# 무경기일(오프시즌/휴식기)은 스크립트가 깨끗하게 skip + HC success ping.
# 라리가·EPL 여름 휴식기(6~7월)와 MLB 오프시즌(11~3월)은 자동으로 비발행.

on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Slot (football-daily | baseball-daily | all)"
        required: true
        default: "all"
      date:
        description: "Override match date YYYY-MM-DD (optional)"
        required: false
        default: ""
      force:
        description: "Re-publish even if slug already exists (true/false)"
        required: false
        default: "false"
  schedule:
    - cron: "20 1 * * *"     # football-daily (10:20 KST, 어제 유럽 경기)
    - cron: "50 8 * * *"     # baseball-daily (17:50 KST, 어제 MLB 슬레이트)

permissions:
  contents: write

jobs:
  resolve-slot:
    name: Resolve slot from schedule
    runs-on: ubuntu-latest
    outputs:
      slot: ${{ steps.pick.outputs.slot }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${{ github.event.schedule }}" in
            "20 1 * * *")  echo "slot=football-daily" >> "$GITHUB_OUTPUT" ;;
            "50 8 * * *")  echo "slot=baseball-daily" >> "$GITHUB_OUTPUT" ;;
            *)             echo "slot=baseball-daily" >> "$GITHUB_OUTPUT" ;;
          esac

  run-slot:
    needs: resolve-slot
    name: Publish ${{ needs.resolve-slot.outputs.slot }}
    runs-on: ubuntu-latest
    if: needs.resolve-slot.outputs.slot != ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install fonts (CJK + Nanum + DejaVu fallback for OG)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-nanum fonts-noto-cjk fonts-noto-cjk-extra fonts-dejavu
          fc-list | grep -iE "nanum|noto.*cjk" | head -8 || echo "(font listing failed but install ran)"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Configure git
        run: |
          git config --global user.name "luckyplz-bot"
          git config --global user.email "noreply@anthropic.com"

      - name: Run pipeline (single slot)
        if: needs.resolve-slot.outputs.slot != 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # football-data.org free API key — required for football-daily.
          # Register a free key at https://www.football-data.org/client/register
          # then add it as a repo secret: Settings → Secrets and variables →
          # Actions → New repository secret → FOOTBALL_DATA_KEY.
          # baseball-daily uses MLB StatsAPI (keyless), so it runs without this.
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          LP_GIT_PUSH: "1"
          # Optional Healthchecks.io per-slot ping URLs (silent no-op if empty):
          #   HC_URL_FOOTBALL_DAILY, HC_URL_BASEBALL_DAILY
          HC_URL_FOOTBALL_DAILY: ${{ secrets.HC_URL_FOOTBALL_DAILY }}
          HC_URL_BASEBALL_DAILY: ${{ secrets.HC_URL_BASEBALL_DAILY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          DATE_ARG=""
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE_ARG="--date ${{ github.event.inputs.date }}"
          fi
          FORCE_ARG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python scripts/auto-sports-post.py --slot ${{ needs.resolve-slot.outputs.slot }} $DATE_ARG $FORCE_ARG

      - name: Run pipeline (both slots)
        if: needs.resolve-slot.outputs.slot == 'all'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
          LP_GIT_PUSH: "1"
          HC_URL_FOOTBALL_DAILY: ${{ secrets.HC_URL_FOOTBALL_DAILY }}
          HC_URL_BASEBALL_DAILY: ${{ secrets.HC_URL_BASEBALL_DAILY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          for SLOT in football-daily baseball-daily; do
            echo "=== Running $SLOT ==="
            python scripts/auto-sports-post.py --slot "$SLOT" || echo "[warn] $SLOT failed; continuing"
            sleep 5
          done
