<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>mp UI fixture game</title>
<meta name="robots" content="noindex">
<style>
body{margin:0;background:#0f1024;color:#fff;font:15px system-ui,sans-serif;min-height:100vh}
#homeBtn{position:fixed;left:10px;top:10px;color:#fff;text-decoration:none;font-weight:700;padding:8px}
#setup{max-width:520px;margin:0 auto;padding:64px 16px 16px}
.fake{height:120px;border:1px dashed rgba(255,255,255,.25);border-radius:14px;margin:8px 0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5)}
#drawBtn{width:100%;min-height:52px;border-radius:14px;border:0;background:#FF6B35;color:#fff;font-weight:900;font-size:18px}
#badgeHost{margin-top:10px;text-align:center}
#playScr{display:none;position:fixed;inset:0;background:#07310f;align-items:center;justify-content:center;font-size:28px;font-weight:900}
body.playing #playScr{display:flex}
</style></head>
<body>
<!-- 하네스 전용 가짜 게임 페이지 (scripts/mp/fixtures, public 밖). 경로 /games/<id>/ 로 서빙된다.
     실제 게임처럼: 인라인 스크립트가 먼저 돌고 → siteFooter.js(v2 로더) → lpRoomsUI 가 LpRoomsQ 를 부른다. -->
<a href="/" id="homeBtn">← Home</a>
<div id="setup">
  <div class="fake">settings</div>
  <button id="drawBtn" type="button">DRAW</button>
  <div id="badgeHost"></div>
</div>
<div id="playScr">PLAYING</div>
<script>
(function(){
  var gid = (location.pathname.split('/')[2] || 'yut');
  var SPEC = {
    yut: { gameId:'yut', kind:'turn', seats:[2,4], lateJoin:'takeBot', migratable:true,
      picks:[{ key:'char', options:['a','b','c','d'], unique:true, botYield:true }], options:[{ key:'turnSec', values:[15,30,60], def:30 }] },
    ludo: { gameId:'ludo', kind:'turn', seats:[2,4], picks:[{ key:'color', options:['r','g','b','y'], unique:true }] },
    roulette: { gameId:'roulette', kind:'draw', seats:null }
  };
  var LABELS = { 'char.a':'🐯', 'char.b':'🐰', 'char.c':'🐶', 'char.d':'🐼', 'color.r':'🔴', 'color.g':'🟢', 'color.b':'🔵', 'color.y':'🟡', 'turnSec.15':'15s', 'turnSec.30':'30s', 'turnSec.60':'60s' };
  window.__fx = { starts: 0 };
  window.LpRoomsQ = window.LpRoomsQ || [];
  LpRoomsQ.push(function (R, UI) {
    var spec = window.__mpAdapter || SPEC[gid] || { gameId: gid, kind: 'turn', seats: [1, 8] };
    R.adapter(spec);
    UI.config({ labels: LABELS, stripEl: function(){ return document.getElementById('setup'); } });
    UI.on('play', function(){ document.body.classList.add('playing'); });
    UI.on('lobby', function(){ document.body.classList.remove('playing'); });
  });
})();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(r){r.forEach(function(s){s.unregister()})}).catch(function(){})}</script>
<script src="/vendor/supabase.min.js"></script>
<script src="/js/siteFooter.js?v=1" defer></script>
</body></html>
