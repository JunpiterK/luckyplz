<title>불을 훔친 사람들</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;900&family=IBM+Plex+Sans+KR:wght@400;600&family=Nanum+Pen+Script&display=swap">
<style>
/* 한 장씩 넘기는 세로 책 — 가운데 한 단(≈34em), 위에 얇은 막대(차례·글자 크기·테마), 아래 앞뒤 장 */
:root{
  --paper:#eceeec; --ink:#1d2225; --muted:#5b6569; --line:#cfd5d3; --panel:#e2e6e4;
  --accent:#a84b24; --memo:#2b4f7a; --quote:#2d5a69;
  --f-body:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  --f-ui:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-hand:"Nanum Pen Script","Nanum Pen","Comic Sans MS",cursive;
  --fs:18px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0d1215; --ink:#d6dbd8; --muted:#87918f; --line:#243035; --panel:#141b1f;
  --accent:#e38b5d; --memo:#9cc0ea; --quote:#8fb9c4; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0d1215; --ink:#d6dbd8; --muted:#87918f; --line:#243035; --panel:#141b1f;
  --accent:#e38b5d; --memo:#9cc0ea; --quote:#8fb9c4; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:var(--fs);line-height:1.9;
  word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:6px;padding:8px 12px;font-family:var(--f-ui);font-size:14px;line-height:1.2}
.bar button{font:inherit;color:var(--ink);background:none;border:1px solid var(--line);border-radius:8px;padding:7px 10px;cursor:pointer;min-height:36px}
.bar button:hover{border-color:var(--accent)}
.bar button:focus-visible,.toc a:focus-visible,.nav a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar .now{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);padding-inline:4px}
.prog{position:absolute;left:0;bottom:-1px;height:2px;background:var(--accent);width:0;transition:width .15s linear}
@media (prefers-reduced-motion:reduce){.prog{transition:none}}

main{max-width:34em;margin-inline:auto;padding-inline:20px;padding-block:28px 72px}
.cover{text-align:center;padding-block:28px 8px;border-bottom:1px solid var(--line);margin-bottom:28px}
.cover .k{font-family:var(--f-ui);font-size:12px;letter-spacing:.24em;color:var(--muted)}
.cover h1{font-weight:900;font-size:clamp(34px,9vw,52px);line-height:1.15;margin:.35em 0 .2em;letter-spacing:-.02em;text-wrap:balance}
.cover p{margin:0;color:var(--muted);font-size:.9em}
.cover .dv{font-family:var(--f-ui);font-size:12px;color:var(--accent);margin-top:10px;font-variant-numeric:tabular-nums}

article h2{font-weight:900;font-size:1.6em;line-height:1.3;margin:1.2em 0 .6em;text-wrap:balance;letter-spacing:-.01em}
article h2:first-child{margin-top:.2em}
article h3{font-family:var(--f-ui);font-weight:600;font-size:.82em;text-align:center;color:var(--accent);letter-spacing:.2em;margin:2.4em 0 1.2em}
article h4,article h5{font-family:var(--f-ui);font-weight:600;font-size:.95em;margin:1.6em 0 .6em}
article p{margin:0 0 1.15em}
article hr{border:0;height:1px;background:var(--line);margin:2.2em auto;width:40%}
article em{font-family:var(--f-hand);font-style:normal;font-size:1.32em;line-height:1.3;color:var(--memo)}
article strong{font-weight:600}
article blockquote{margin:1.4em 0;padding:.2em 0 .2em 1em;border-left:2px solid var(--accent);color:var(--quote);font-size:.94em}
article blockquote p{margin:.3em 0}
article code{font-family:ui-monospace,Consolas,monospace;font-size:.85em;background:var(--panel);padding:.05em .35em;border-radius:4px}
article pre{background:var(--panel);padding:12px;border-radius:8px;overflow-x:auto;font-size:.8em;line-height:1.5}
article ul,article ol{padding-left:1.2em;margin:0 0 1.15em}
article li{margin:.25em 0}
article li.d1{margin-left:1.2em}article li.d2{margin-left:2.4em}article li.d3{margin-left:3.6em}
.tw{overflow-x:auto;margin:1em 0 1.4em;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-family:var(--f-ui);font-size:13.5px;line-height:1.55;min-width:100%}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;white-space:nowrap}
table em{font-size:1.25em}

.notes{margin-top:2.6em;border-top:1px solid var(--line);padding-top:.6em;font-size:.86em}
.notes summary{font-family:var(--f-ui);font-size:13px;color:var(--muted);cursor:pointer;padding:8px 0;list-style:none}
.notes summary::before{content:"＋ ";color:var(--accent)}
.notes[open] summary::before{content:"－ "}
.notes h3{text-align:left;letter-spacing:.05em;margin-top:1.4em}

.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:3em;font-family:var(--f-ui);font-size:14px}
.nav a{display:block;border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--ink);text-decoration:none;min-width:0}
.nav a:hover{border-color:var(--accent)}
.nav a small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.nav a span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .nx{text-align:right;grid-column:2}

.toc{position:fixed;inset:0;z-index:9;display:flex}
.toc .sh{flex:1;background:rgba(0,0,0,.35)}
.toc nav{width:min(340px,86vw);background:var(--paper);border-right:1px solid var(--line);overflow-y:auto;order:-1;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);font-family:var(--f-ui)}
.toc h2{font-family:var(--f-body);font-weight:900;font-size:20px;margin:4px 0 14px}
.toc ul{list-style:none;margin:0;padding:0}
.toc .tb{font-size:12px;letter-spacing:.14em;color:var(--accent);margin:18px 0 6px}
.toc a{display:flex;justify-content:space-between;gap:10px;padding:9px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:14.5px}
.toc a span{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:none}
.toc a.on{background:var(--panel);font-weight:600}
.toc a:hover{background:var(--panel)}
</style>

<div class="bar" id="bar">
  <button type="button" id="bToc" aria-label="차례 열기">☰ 차례</button>
  <div class="now" id="now">불을 훔친 사람들</div>
  <button type="button" id="bMinus" aria-label="글자 작게">가−</button>
  <button type="button" id="bPlus" aria-label="글자 크게">가+</button>
  <button type="button" id="bTheme" aria-label="밝게/어둡게">◐</button>
  <div class="prog" id="prog"></div>
</div>

<div class="toc" id="toc" hidden>
  <nav aria-label="차례">
    <h2>불을 훔친 사람들</h2>
    <ul><!--TOC--></ul>
  </nav>
  <div class="sh" id="tocShade"></div>
</div>

<main id="main">
  <header class="cover" id="cover">
    <div class="k">델타-브이 사가 · 연재 원고</div>
    <h1>불을 훔친 사람들</h1>
    <p>한서윤의 기록, 2002–2061</p>
    <div class="dv">Δv = Isp · g₀ · ln(m₀ / m₁)</div>
  </header>
  <!--CHAPTERS-->
</main>

<script>
(function(){
  var S = {get:function(k){try{return localStorage.getItem(k)}catch(e){return null}}, set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
  var arts = [].slice.call(document.querySelectorAll('article.ch'));
  var links = [].slice.call(document.querySelectorAll('.toc a'));
  var root = document.documentElement, cur = -1;
  var title = function(a){ return a.dataset.t || '불을 훔친 사람들'; };

  arts.forEach(function(a, i){
    var nav = document.createElement('div'); nav.className = 'nav';
    if(i > 0) nav.innerHTML += '<a href="#'+arts[i-1].id+'"><small>← 이전</small><span>'+title(arts[i-1])+'</span></a>';
    if(i < arts.length-1) nav.innerHTML += '<a class="nx" href="#'+arts[i+1].id+'"><small>다음 →</small><span>'+title(arts[i+1])+'</span></a>';
    a.appendChild(nav);
  });

  function show(i, y){
    if(i < 0 || i >= arts.length) i = 0;
    arts.forEach(function(a, k){ a.hidden = k !== i; });
    links.forEach(function(l){ l.classList.toggle('on', +l.dataset.i === i); });
    document.getElementById('cover').hidden = i !== 0;
    document.getElementById('now').textContent = title(arts[i]);
    cur = i; S.set('dvsaga_ch', String(i));
    window.scrollTo(0, y || 0);
    prog();
  }
  function idxOf(h){ for(var k=0;k<arts.length;k++) if(arts[k].id === h) return k; return -1; }
  function fromHash(){ var i = idxOf((location.hash||'').slice(1)); if(i >= 0 && i !== cur) show(i, 0); }
  window.addEventListener('hashchange', function(){ fromHash(); closeToc(); });

  function prog(){
    var h = document.documentElement.scrollHeight - innerHeight;
    document.getElementById('prog').style.width = (h > 0 ? Math.min(100, scrollY / h * 100) : 0) + '%';
  }
  var t = 0;
  window.addEventListener('scroll', function(){ prog(); clearTimeout(t); t = setTimeout(function(){ S.set('dvsaga_y', String(Math.round(scrollY))); }, 250); }, {passive:true});

  var toc = document.getElementById('toc');
  function closeToc(){ toc.hidden = true; }
  document.getElementById('bToc').onclick = function(){ toc.hidden = false; var on = toc.querySelector('a.on'); if(on) on.focus(); };
  document.getElementById('tocShade').onclick = closeToc;
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeToc();
    if(!toc.hidden || e.target.tagName === 'INPUT') return;
    if(e.key === 'ArrowRight' && cur < arts.length-1) location.hash = arts[cur+1].id;
    if(e.key === 'ArrowLeft' && cur > 0) location.hash = arts[cur-1].id;
  });

  var fs = parseFloat(S.get('dvsaga_fs')) || 18;
  function setFs(v){ fs = Math.max(14, Math.min(26, v)); root.style.setProperty('--fs', fs + 'px'); S.set('dvsaga_fs', String(fs)); }
  setFs(fs);
  document.getElementById('bMinus').onclick = function(){ setFs(fs - 1); };
  document.getElementById('bPlus').onclick = function(){ setFs(fs + 1); };

  var th = S.get('dvsaga_theme'); if(th) root.dataset.theme = th;
  document.getElementById('bTheme').onclick = function(){
    var dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark'; S.set('dvsaga_theme', root.dataset.theme);
  };

  var h0 = idxOf((location.hash||'').slice(1));
  if(h0 >= 0) show(h0, 0);
  else { var saved = parseInt(S.get('dvsaga_ch'), 10); show(isNaN(saved) ? 0 : saved, parseInt(S.get('dvsaga_y'), 10) || 0); }
})();
</script>
