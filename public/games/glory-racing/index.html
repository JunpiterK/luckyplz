        #rotateNotice{display:none;position:fixed;inset:0;z-index:5000;background:linear-gradient(160deg,#0A0A1A,#161636);color:#fff;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}

        #rotateNotice .rot-sub{font-size:0.92em;color:rgba(255,255,255,0.6);line-height:1.6;max-width:320px}
        /* Phone in PORTRAIT (shorter side < 560px) → block ONLY the live race with

        @media (orientation:portrait) and (max-width:559px){

        @media (orientation:landscape) and (max-height:559px){

        @media (orientation:portrait) and (max-width:559px){

<script>
/* ===== 8-BIT AUDIO ENGINE ===== */
const AudioEngine = (function(){
    let actx = null, bgmPlaying = false, bgmEnabled = true, masterGain = null;
    let bgmOscillators = [], bgmInterval = null;

    function getCtx(){
        if(!actx){
            actx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = actx.createGain();
            masterGain.gain.value = 0.35;
            masterGain.connect(actx.destination);
        }
        if(actx.state === 'suspended') actx.resume();
        return actx;
    }

    function playSFX(freq, duration, type, volume, slide){
        try{
            const c = getCtx();
            const osc = c.createOscillator();
            const g = c.createGain();
            osc.type = type || 'square';
            osc.frequency.setValueAtTime(freq, c.currentTime);
            if(slide) osc.frequency.linearRampToValueAtTime(slide, c.currentTime + duration);
            g.gain.setValueAtTime((volume||0.15)*0.6, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
            osc.connect(g);
            g.connect(masterGain);
            osc.start(c.currentTime);
            osc.stop(c.currentTime + duration);
        }catch(e){}
    }

    function playNoise(duration, volume){
        try{
            const c = getCtx();
            const bufferSize = c.sampleRate * duration;
            const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
            const data = buffer.getChannelData(0);
            for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1);
            const src = c.createBufferSource();
            src.buffer = buffer;
            const g = c.createGain();
            g.gain.setValueAtTime((volume||0.08)*0.5, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
            src.connect(g);
            g.connect(masterGain);
            src.start(c.currentTime);
        }catch(e){}
    }

    const sfx = {
        countdown: function(){
            playSFX(880, 0.15, 'square', 0.18);
            setTimeout(()=>playSFX(880, 0.08, 'square', 0.1), 80);
        },
        go: function(){
            playSFX(523, 0.08, 'square', 0.2);
            setTimeout(()=>playSFX(659, 0.08, 'square', 0.2), 80);
            setTimeout(()=>playSFX(784, 0.08, 'square', 0.2), 160);
            setTimeout(()=>playSFX(1047, 0.25, 'square', 0.25), 240);
        },
        punch: function(){
            playNoise(0.08, 0.2);
            playSFX(200, 0.1, 'square', 0.15, 80);
        },
        kick: function(){
            playNoise(0.1, 0.22);
            playSFX(150, 0.12, 'sawtooth', 0.12, 60);
        },
        fightStart: function(){
            playSFX(330, 0.06, 'square', 0.18);
            setTimeout(()=>playSFX(440, 0.06, 'square', 0.18), 70);
            setTimeout(()=>playSFX(550, 0.1, 'square', 0.2), 140);
        },
        fightEnd: function(){
            playSFX(600, 0.15, 'square', 0.18, 200);
            setTimeout(()=>playNoise(0.15, 0.15), 50);
        },
        itemGet: function(){
            playSFX(660, 0.06, 'square', 0.18);
            setTimeout(()=>playSFX(880, 0.06, 'square', 0.18), 70);
            setTimeout(()=>playSFX(1100, 0.12, 'square', 0.2), 140);
        },
        boost: function(){
            playSFX(400, 0.3, 'sawtooth', 0.15, 1200);
        },
        stun: function(){
            playSFX(300, 0.3, 'square', 0.15, 100);
            setTimeout(()=>playSFX(250, 0.2, 'square', 0.1, 80), 100);
        },
        slow: function(){
            playSFX(500, 0.4, 'triangle', 0.12, 150);
        },
        splash: function(){
            playNoise(0.2, 0.12);
            playSFX(400, 0.15, 'sine', 0.08, 200);
        },
        jump: function(){
            playSFX(250, 0.2, 'square', 0.12, 600);
        },
        finish: function(){
            const notes = [523,659,784,1047,784,1047,1319];
            notes.forEach((n,i)=>{
                setTimeout(()=>playSFX(n, 0.15, 'square', 0.2), i*100);
            });
        },
        gameEnd: function(){
            const melody = [523,0,659,0,784,0,1047,1047,0,784,1047,1319,1568];
            melody.forEach((n,i)=>{
                if(n>0) setTimeout(()=>playSFX(n, 0.2, 'square', 0.22), i*120);
            });
        },
        trip: function(){
            playSFX(300, 0.15, 'square', 0.1, 100);
            setTimeout(()=>playNoise(0.08, 0.1), 80);
        },
        iceSlip: function(){
            playSFX(500, 0.12, 'sine', 0.12, 200);
            setTimeout(()=>playSFX(300, 0.15, 'square', 0.1, 100), 60);
            setTimeout(()=>playNoise(0.08, 0.1), 120);
        },
        warning: function(){
            playSFX(880, 0.1, 'square', 0.15);
            setTimeout(()=>playSFX(660, 0.1, 'square', 0.15), 150);
        }
    };

    const BGM_BPM = 312;
    const BEAT = 60 / BGM_BPM;

    const melodyPattern = [
        494,440,415,440, 523,0,523,0,  587,523,494,523, 659,0,659,0,
        698,659,622,659, 988,880,831,880, 1047,0,988,880, 831,880,523,0,
        494,440,415,440, 523,0,523,0,  587,523,494,523, 659,0,659,0,
        698,659,622,659, 988,880,831,880, 1047,988,880,0, 880,0,0,0,
        880,0,1047,880, 659,0,880,0,  1047,0,1175,1047, 880,0,659,0,
        880,0,1047,880, 659,0,880,0,  1047,1175,1319,1175, 1047,880,659,0,
        1319,1175,1047,880, 784,659,523,440, 523,587,659,784, 880,988,1047,0,
        880,784,659,523, 440,415,440,523, 659,523,440,0,  880,0,0,0
    ];

    const bassPattern = [
        110,0,110,165, 131,0,131,0,  147,0,147,165, 165,0,165,0,
        175,0,175,131, 165,0,165,0,  110,0,131,165, 110,0,110,0,
        110,0,110,165, 131,0,131,0,  147,0,147,165, 165,0,165,0,
        175,0,175,131, 165,0,165,0,  110,0,165,131, 110,0,110,0,
        220,0,220,165, 131,0,220,0,  220,0,220,165, 131,0,165,0,
        220,0,220,165, 131,0,220,0,  220,0,175,165, 131,165,131,0,
        220,175,165,131, 110,131,110,0, 110,0,131,147, 165,175,220,0,
        165,131,110,131, 110,0,110,131, 165,131,110,0, 220,0,110,0
    ];

    const arpeggioPattern = [
        220,262,330,262, 262,330,392,330, 294,349,440,349, 330,415,494,415,
        349,440,523,440, 330,415,494,415, 262,330,392,415, 262,330,262,220,
        220,262,330,262, 262,330,392,330, 294,349,440,349, 330,415,494,415,
        349,440,523,440, 330,415,494,415, 262,330,440,330, 220,262,220,0,
        440,523,659,523, 330,440,523,440, 440,523,659,523, 330,440,523,440,
        440,523,659,523, 330,440,523,440, 440,523,587,523, 440,330,262,0,
        440,523,659,440, 330,262,220,175, 220,262,330,392, 440,494,523,440,
        330,262,220,262, 220,0,220,262, 330,262,220,0,  440,330,220,0
    ];

    const drumPattern = [
        1,3,2,3, 1,3,2,3, 1,3,2,3, 1,3,2,3,
        1,3,2,3, 1,3,2,3, 1,3,2,3, 1,1,2,2,
        1,3,2,3, 1,3,2,3, 1,3,2,3, 1,3,2,3,
        1,3,2,3, 1,3,2,3, 1,3,2,3, 1,1,2,2,
        1,3,2,3, 1,3,1,3, 1,3,2,3, 1,3,1,3,
        1,3,2,3, 1,3,1,3, 1,3,2,3, 1,1,1,2,
        1,3,2,3, 1,3,2,3, 1,3,2,3, 1,3,2,3,
        1,3,2,3, 1,1,2,3, 1,3,2,3, 1,2,1,2
    ];

    let bgmStep = 0;

    function playBGMStep(){
        if(!bgmEnabled || !bgmPlaying) return;
        const c = getCtx();
        const idx = bgmStep % melodyPattern.length;

        const melNote = melodyPattern[idx];
        if(melNote > 0){
            const osc = c.createOscillator();
            const g = c.createGain();
            osc.type = 'square';
            osc.frequency.value = melNote;
            g.gain.setValueAtTime(0.09, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + BEAT*0.85);
            osc.connect(g); g.connect(masterGain);
            osc.start(c.currentTime); osc.stop(c.currentTime + BEAT*0.9);
        }

        const bassNote = bassPattern[idx];
        if(bassNote > 0){
            const osc = c.createOscillator();
            const g = c.createGain();
            osc.type = 'triangle';
            osc.frequency.value = bassNote;
            g.gain.setValueAtTime(0.12, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + BEAT*0.8);
            osc.connect(g); g.connect(masterGain);
            osc.start(c.currentTime); osc.stop(c.currentTime + BEAT*0.85);
        }

        const arpNote = arpeggioPattern[idx];
        if(arpNote > 0){
            const osc = c.createOscillator();
            const g = c.createGain();
            osc.type = 'square';
            osc.frequency.value = arpNote;
            g.gain.setValueAtTime(0.04, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + BEAT*0.5);

            osc.start(c.currentTime); osc.stop(c.currentTime + BEAT*0.55);
        }

        const drum = drumPattern[idx];
        if(drum === 1){
            const osc = c.createOscillator();
            const g = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, c.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, c.currentTime + 0.1);
            g.gain.setValueAtTime(0.2, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.12);
            osc.connect(g); g.connect(masterGain);
            osc.start(c.currentTime); osc.stop(c.currentTime + 0.12);
        } else if(drum === 2){
            const bufLen = Math.floor(c.sampleRate * 0.06);
            const buf = c.createBuffer(1, bufLen, c.sampleRate);
            const d = buf.getChannelData(0);
            for(let i=0;i<bufLen;i++) d[i]=Math.random()*2-1;
            const src = c.createBufferSource();
            src.buffer = buf;
            const g = c.createGain();
            g.gain.setValueAtTime(0.14, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.06);
            const flt = c.createBiquadFilter();
            flt.type = 'highpass'; flt.frequency.value = 2000;
            src.connect(flt); flt.connect(g); g.connect(masterGain);
            src.start(c.currentTime);
        } else if(drum === 3){
            const bufLen = Math.floor(c.sampleRate * 0.02);
            const buf = c.createBuffer(1, bufLen, c.sampleRate);
            const d = buf.getChannelData(0);
            for(let i=0;i<bufLen;i++) d[i]=Math.random()*2-1;
            const src = c.createBufferSource();
            src.buffer = buf;
            const g = c.createGain();
            g.gain.setValueAtTime(0.06, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.02);
            const flt = c.createBiquadFilter();

            src.connect(flt); flt.connect(g); g.connect(masterGain);

        }

    }

    function startBGM(){
        if(bgmPlaying) return;
        bgmPlaying = true;
        bgmStep = 0;
        const intervalMs = BEAT * 1000;
        bgmInterval = setInterval(playBGMStep, intervalMs);
    }

    function stopBGM(){
        bgmPlaying = false;
        if(bgmInterval){ clearInterval(bgmInterval); bgmInterval = null; }
    }

    function toggleBGM(){
        bgmEnabled = !bgmEnabled;
        if(!bgmEnabled) stopBGM();
        return bgmEnabled;
    }

    function isBGMEnabled(){ return bgmEnabled; }
    function isBGMPlaying(){ return bgmPlaying; }

    return { sfx, startBGM, stopBGM, toggleBGM, isBGMEnabled, isBGMPlaying, getCtx };
})();

function isFightNearby(x,y,threshold){return fightPairs.some(pair=>{const mx=(pair.player1.x+pair.player2.x)/2,my=(pair.player1.y+pair.player2.y)/2;return distance(x,y,mx,my)<threshold})}

function generateSnakeTrack(){track=[];const rows=5,usableHeight=HEIGHT-MARGIN*2,rowHeight=usableHeight/(rows-1);let points=[];for(let row=0;row<rows;row++){const y=MARGIN+row*rowHeight,goingRight=row%2===0;if(goingRight){points.push({x:MARGIN,y:y});points.push({x:WIDTH-RIGHT_MARGIN,y:y})}else{points.push({x:WIDTH-RIGHT_MARGIN,y:y});points.push({x:MARGIN,y:y})}}const segments=250;for(let i=0;i<segments;i++){const t=i/(segments-1),totalLength=points.length-1,segment=Math.min(Math.floor(t*totalLength),totalLength-1),localT=(t*totalLength)-segment;const p0=points[Math.max(0,segment-1)],p1=points[segment],p2=points[Math.min(totalLength,segment+1)],p3=points[Math.min(totalLength,segment+2)];const point=catmullRom(p0,p1,p2,p3,localT);point.x=clamp(point.x,MARGIN,WIDTH-RIGHT_MARGIN);point.y=clamp(point.y,MARGIN,HEIGHT-MARGIN);track.push({x:point.x,y:point.y,index:i})}generateZones();generateTrackObstacles();generateItemBoxes();generateScenery()}

/* ===== [FIX v3.0] 존 배치 - 교대 균등 배치 (Hill/Water/Mud 각 2회) ===== */
/* 트랙 위치 배치도 (교대):
   0.08 Hill | 0.22 Water | 0.36 Mud | 0.50 Hill | 0.64 Water | 0.78 Mud
   Ice: 0.46, 0.86  |  Boost: 0.15, 0.57 */
function generateZones(){
    deepWaterZones=[];hillZones=[];mudZones=[];iceZones=[];boostZones=[];
    const waterLength=Math.floor(track.length*0.056);
    const hillLength=15;
    const mudLength=10;
    const GAP=12;

    /* 교대 배치: Hill→Water→Mud→Hill→Water→Mud */
    const hazardSlots=[
        {type:'hill',  pos:0.08},
        {type:'water', pos:0.22},
        {type:'mud',   pos:0.36},
        {type:'hill',  pos:0.50},
        {type:'water', pos:0.64},
        {type:'mud',   pos:0.78}
    ];

    hazardSlots.forEach(slot=>{
        let start=Math.floor(track.length*slot.pos);
        switch(slot.type){
            case 'water':
                if(!isOverlappingAnyZone(start, start+waterLength))
                    deepWaterZones.push({start:start, end:start+waterLength, width:TRACK_WIDTH+25});
                break;
            case 'hill':
                if(!isOverlappingAnyZone(start, start+hillLength))
                    hillZones.push({start:start, end:start+hillLength, height:35+Math.random()*15});
                break;
            case 'mud':
                if(isOverlappingAnyZone(start, start+mudLength)){
                    start+=GAP;
                    if(isOverlappingAnyZone(start, start+mudLength)) start-=GAP*2;
                }
                if(start>15 && start+mudLength<track.length-15 && !isOverlappingAnyZone(start, start+mudLength))
                    mudZones.push({start:start, end:start+mudLength, width:TRACK_WIDTH});
                break;
        }
    });

    /* Ice */
    [0.46, 0.86].forEach(pos=>{
        let start=Math.floor(track.length*pos);
        if(isOverlappingAnyZone(start, start+8)){
            start+=GAP;
            if(isOverlappingAnyZone(start, start+8)) start-=GAP*2;
        }
        if(start>15 && start+8<track.length-15 && !isOverlappingAnyZone(start, start+8))
            iceZones.push({start:start, end:start+8, width:TRACK_WIDTH});
    });

    /* Boost */
    [0.15, 0.57].forEach(pos=>{
        let start=Math.floor(track.length*pos);
        if(isOverlappingAnyZone(start, start+6)){
            start+=GAP;
            if(isOverlappingAnyZone(start, start+6)) start-=GAP*2;
        }
        if(start>10 && start+6<track.length-10 && !isOverlappingAnyZone(start, start+6))
            boostZones.push({start:start, end:start+6, width:TRACK_WIDTH*0.6});
    });
}

function isOverlappingWater(start,end){return deepWaterZones.some(z=>start<z.end+20&&end>z.start-20)}
function isOverlappingAnyZone(start,end){return isOverlappingWater(start,end)||hillZones.some(z=>start<z.end+15&&end>z.start-15)||mudZones.some(z=>start<z.end+15&&end>z.start-15)||iceZones.some(z=>start<z.end+15&&end>z.start-15)||boostZones.some(z=>start<z.end+15&&end>z.start-15)}

function generateTrackObstacles(){trackObstacles=[];const numObstacles=25;for(let i=0;i<numObstacles;i++){const trackPos=Math.floor(35+(i/numObstacles)*(track.length-70));if(isOverlappingAnyZone(trackPos-3,trackPos+3))continue;const types=['rock','cone','barrel','hurdle','hurdle','tire'];const type=types[randomInt(0,types.length-1)];trackObstacles.push({trackPos:trackPos,type:type,size:type==='hurdle'?40:22+Math.random()*20,offsetX:(Math.random()-0.5)*70,offsetY:(Math.random()-0.5)*15,rotation:Math.random()*Math.PI*2})}}

function generateItemBoxes(){itemBoxes=[];const count=8;for(let i=0;i<count;i++){const pos=0.08+i*(0.84/(count-1));const trackPos=Math.floor(track.length*pos)+(Math.floor(Math.random()*10)-5);itemBoxes.push({trackPos:clamp(trackPos,20,track.length-20),offsetX:(Math.random()-0.5)*50,active:true,respawnTimer:0,floatPhase:Math.random()*Math.PI*2})}}

function generateScenery(){sceneryObjects=[];for(let i=0;i<track.length;i+=35){if(Math.random()>0.4){const point=track[i],side=Math.random()>0.5?1:-1,dist=TRACK_WIDTH/2+50+Math.random()*100;let perpX=0,perpY=side;if(i<track.length-1){const dx=track[i+1].x-track[i].x,dy=track[i+1].y-track[i].y,len=Math.sqrt(dx*dx+dy*dy);if(len>0){perpX=-dy/len*side;perpY=dx/len*side}}const objX=point.x+perpX*dist,objY=point.y+perpY*dist;if(objX>40&&objX<WIDTH-RIGHT_MARGIN+20&&objY>40&&objY<HEIGHT-40){const types=['tree','pine','rock','bush','flower','mushroom'];sceneryObjects.push({type:types[randomInt(0,types.length-1)],x:objX,y:objY,scale:0.5+Math.random()*0.5,variation:randomInt(0,2)})}}}}

function drawBoostZones(){boostZones.forEach(zone=>{const time=frameNow/200;ctx.strokeStyle=`rgba(0,255,136,${0.5+Math.sin(time)*0.3})`;ctx.lineWidth=zone.width;ctx.lineCap='round';ctx.beginPath();for(let i=zone.start;i<=zone.end&&i<track.length;i++){if(i===zone.start)ctx.moveTo(track[i].x,track[i].y);else ctx.lineTo(track[i].x,track[i].y)}ctx.stroke();for(let i=zone.start;i<=zone.end&&i<track.length;i+=4){const point=track[i],nextPoint=track[Math.min(i+2,track.length-1)],angle=Math.atan2(nextPoint.y-point.y,nextPoint.x-point.x);ctx.save();ctx.translate(point.x,point.y);ctx.rotate(angle);ctx.fillStyle='rgba(255,255,255,0.8)';ctx.beginPath();ctx.moveTo(15,0);ctx.lineTo(-5,-10);ctx.lineTo(-5,10);ctx.fill();ctx.restore()}const midIndex=Math.floor((zone.start+zone.end)/2);if(midIndex<track.length){ctx.font='bold '+Math.round(12*DRAW_SCALE)+'px Orbitron,sans-serif';ctx.textAlign='center';ctx.fillStyle='#00FF88';ctx.strokeStyle='rgba(0,0,0,0.6)';ctx.lineWidth=3;ctx.strokeText('⚡ BOOST ⚡',track[midIndex].x,track[midIndex].y+5);ctx.fillText('⚡ BOOST ⚡',track[midIndex].x,track[midIndex].y+5)}})}
function drawItemBoxes(){const time=frameNow/1000;itemBoxes.forEach(box=>{if(!box.active)return;if(box.trackPos<0||box.trackPos>=track.length)return;const point=track[Math.floor(box.trackPos)],floatY=Math.sin(box.floatPhase+time*3)*6,x=point.x+box.offsetX,y=point.y+floatY-15;ctx.save();ctx.translate(x,y);ctx.scale(DRAW_SCALE,DRAW_SCALE);ctx.rotate(time*2);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(0,20-floatY,18,8,0,0,Math.PI*2);ctx.fill();const gradient=ctx.createLinearGradient(-15,-15,15,15);gradient.addColorStop(0,'#FFD700');gradient.addColorStop(0.5,'#FFA500');gradient.addColorStop(1,'#FF6B00');ctx.fillStyle=gradient;ctx.fillRect(-15,-15,30,30);ctx.fillStyle='rgba(255,255,255,0.5)';ctx.fillRect(-15,-15,30,8);ctx.fillStyle='#FFF';ctx.font='bold 18px Arial';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',0,2);ctx.restore()})}
function drawObstacles(){trackObstacles.forEach(obs=>{if(obs.trackPos<0||obs.trackPos>=track.length)return;const point=track[Math.floor(obs.trackPos)],x=point.x+obs.offsetX,y=point.y+obs.offsetY;ctx.save();ctx.translate(x,y);ctx.scale(DRAW_SCALE,DRAW_SCALE);switch(obs.type){case 'rock':ctx.fillStyle='rgba(0,0,0,0.25)';ctx.beginPath();ctx.ellipse(4,5,obs.size*0.7,obs.size*0.35,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#5D4037';ctx.beginPath();ctx.ellipse(0,0,obs.size*0.65,obs.size*0.42,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8D6E63';ctx.beginPath();ctx.ellipse(-obs.size*0.18,-obs.size*0.12,obs.size*0.28,obs.size*0.18,-0.3,0,Math.PI*2);ctx.fill();break;case 'cone':ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(2,8,14,6,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#FF6B00';ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(-14,8);ctx.lineTo(14,8);ctx.fill();ctx.fillStyle='#FFF';ctx.fillRect(-12,-8,24,6);ctx.fillRect(-10,0,20,6);break;case 'barrel':ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(3,8,16,8,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#D84315';ctx.fillRect(-14,-18,28,28);ctx.fillStyle='#BF360C';ctx.fillRect(-14,-18,28,6);ctx.fillRect(-14,4,28,6);break;case 'hurdle':ctx.fillStyle='rgba(0,0,0,0.2)';ctx.fillRect(-20,10,40,5);ctx.fillStyle='#BF360C';ctx.fillRect(-20,-30,6,42);ctx.fillRect(14,-30,6,42);ctx.fillStyle='#FF5722';ctx.fillRect(-22,-33,44,8);ctx.fillStyle='#FFF';ctx.font='bold 11px Orbitron';ctx.textAlign='center';ctx.strokeStyle='#BF360C';ctx.lineWidth=2;ctx.strokeText('JUMP!',0,-38);ctx.fillText('JUMP!',0,-38);break;case 'tire':ctx.fillStyle='rgba(0,0,0,0.2)';ctx.beginPath();ctx.ellipse(3,5,18,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#37474F';ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#263238';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();break}ctx.restore()})}
function drawFinishLine(){const finishIndex=track.length-6;if(finishIndex<=0||finishIndex>=track.length)return;const finishPoint=track[finishIndex],prevPoint=track[finishIndex-1];const dx=finishPoint.x-prevPoint.x,dy=finishPoint.y-prevPoint.y;const trackAngle=Math.atan2(dy,dx),perpAngle=trackAngle+Math.PI/2;const finishWidth=130,finishThickness=20,squareSize=10;ctx.save();ctx.translate(finishPoint.x,finishPoint.y);ctx.rotate(perpAngle);ctx.scale(DRAW_SCALE,DRAW_SCALE);ctx.fillStyle='#fff';ctx.fillRect(-finishWidth/2,-finishThickness/2,finishWidth,finishThickness);ctx.fillStyle='#000';for(let row=0;row<2;row++)for(let col=0;col<13;col++)if((row+col)%2===0)ctx.fillRect(-finishWidth/2+col*squareSize,-finishThickness/2+row*squareSize,squareSize,squareSize);ctx.fillStyle='#FFD700';ctx.font='bold 18px Orbitron';ctx.textAlign='center';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText('🏁 FINISH 🏁',0,-finishThickness/2-12);ctx.fillText('🏁 FINISH 🏁',0,-finishThickness/2-12);ctx.restore();}
function drawPlayer(player){const x=player.x,y=player.y;if(player.trail.length>0)player.trail.forEach(t=>{ctx.fillStyle=player.starActive?`rgba(255,215,0,${t.life*0.5})`:`rgba(0,200,255,${t.life*0.5})`;ctx.beginPath();ctx.arc(t.x,t.y,8*t.life,0,Math.PI*2);ctx.fill()});ctx.save();ctx.translate(x,y);if(player.hitFlash>0)ctx.translate(Math.sin(frameNow*0.1)*3,0);if(!player.facingRight)ctx.scale(-1,1);let scale=1;if(player.state===PlayerState.JUMPING)scale=1+Math.sin(player.stateTimer*5)*0.1;else if(player.state===PlayerState.CELEBRATING)scale=1+Math.sin(frameNow*0.01)*0.15;ctx.scale(scale*DRAW_SCALE,scale*DRAW_SCALE);ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(0,25,18,8,0,0,Math.PI*2);ctx.fill();if(player.starActive){ctx.fillStyle=`rgba(255,215,0,${0.3+Math.sin(frameNow*0.01)*0.15})`;ctx.beginPath();ctx.arc(0,-10,35,0,Math.PI*2);ctx.fill();for(let i=0;i<5;i++){const angle=frameNow*0.003+i*Math.PI*0.4,dist=30+Math.sin(frameNow*0.005+i)*10;ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(Math.cos(angle)*dist,-10+Math.sin(angle)*dist,4,0,Math.PI*2);ctx.fill()}}else if(player.shieldActive){ctx.strokeStyle=`rgba(100,200,255,${0.5+Math.sin(frameNow*0.01)*0.3})`;ctx.lineWidth=4;ctx.beginPath();ctx.arc(0,-10,32,0,Math.PI*2);ctx.stroke()}if(player.boostActive){ctx.fillStyle=`rgba(255,100,0,${0.4+Math.sin(frameNow*0.02)*0.2})`;ctx.beginPath();ctx.moveTo(-15,5);ctx.lineTo(-35,0);ctx.lineTo(-15,-5);ctx.closePath();ctx.fill()}if(player.slowTimer>0){ctx.fillStyle=`rgba(100,100,255,${0.3+Math.sin(frameNow*0.02)*0.2})`;ctx.beginPath();ctx.arc(0,-5,25,0,Math.PI*2);ctx.fill()}switch(player.state){case PlayerState.RUNNING:case PlayerState.BOOSTED:drawRunningPlayer(player);break;case PlayerState.JUMPING:drawJumpingPlayer(player);break;case PlayerState.SWIMMING:drawSwimmingPlayer(player);break;case PlayerState.ATTACKING:drawAttackingPlayer(player);break;case PlayerState.KNOCKED_DOWN:case PlayerState.STUNNED:drawKnockedDownPlayer(player);break;case PlayerState.ICE_FALLEN:drawIceFallenPlayer(player);break;case PlayerState.GETTING_UP:drawGettingUpPlayer(player);break;case PlayerState.TRIPPED:drawTrippedPlayer(player);break;case PlayerState.CLIMBING_HILL:drawClimbingPlayer(player);break;case PlayerState.IN_MUD:drawMudPlayer(player);break;case PlayerState.SLIDING:drawSlidingPlayer(player);break;case PlayerState.CELEBRATING:drawCelebratingPlayer(player);break;default:drawRunningPlayer(player)}if(player.hitFlash>0){ctx.globalCompositeOperation='source-atop';ctx.fillStyle=`rgba(255,0,0,${player.hitFlash*0.5})`;ctx.fillRect(-30,-55,60,80);ctx.globalCompositeOperation='source-over'}ctx.restore();ctx.save();const _ns=DRAW_SCALE;ctx.fillStyle=player.finished?'#FFD700':'#fff';ctx.font=player.finished?('bold '+Math.round(13*_ns)+'px Noto Sans KR'):(Math.round(12*_ns)+'px Noto Sans KR');ctx.textAlign='center';ctx.strokeStyle='rgba(0,0,0,0.7)';ctx.lineWidth=3;ctx.strokeText(player.name,x,y-50*_ns);ctx.fillText(player.name,x,y-50*_ns);if(player.finished){ctx.font='bold '+Math.round(14*_ns)+'px Orbitron';ctx.fillStyle='#FFD700';ctx.strokeText(rankLabel(player.finishRank),x,y-65*_ns);ctx.fillText(rankLabel(player.finishRank),x,y-65*_ns)}
if(player.state===PlayerState.STUNNED){ctx.font=Math.round(32*DRAW_SCALE)+'px Arial';ctx.textAlign='center';ctx.fillText('💫',x,y-75*DRAW_SCALE)}if(player.state===PlayerState.ICE_FALLEN){ctx.font=Math.round(28*DRAW_SCALE)+'px Arial';ctx.textAlign='center';ctx.fillText('❄️',x,y-75*DRAW_SCALE)}if(player.slowTimer>0){ctx.font=Math.round(36*DRAW_SCALE)+'px Arial';ctx.textAlign='center';ctx.fillText('🐢',x,y-80*DRAW_SCALE)}if(player.boostActive){ctx.font=Math.round(36*DRAW_SCALE)+'px Arial';ctx.textAlign='center';ctx.fillText('⚡',x,y-80*DRAW_SCALE)}ctx.restore()}
function drawRunningPlayer(player){const t=frameNow*0.01,runCycle=Math.sin(t*(player.boostActive?1.5:1));ctx.fillStyle=player.shirtColor;ctx.beginPath();ctx.ellipse(0,-15,12,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fillRect(-4,-25,8,3);ctx.fillStyle=player.pantsColor;const legAngle=runCycle*0.5;ctx.save();ctx.translate(-4,0);ctx.rotate(legAngle);ctx.fillRect(-4,0,8,22);ctx.restore();ctx.save();ctx.translate(4,0);ctx.rotate(-legAngle);ctx.fillRect(-4,0,8,22);ctx.restore();ctx.fillStyle='#333';ctx.fillRect(-8+Math.sin(legAngle)*5,18,8,5);ctx.fillRect(0-Math.sin(legAngle)*5,18,8,5);ctx.fillStyle=player.skinTone;ctx.save();ctx.translate(-13,-15);ctx.rotate(-runCycle*0.4);ctx.fillRect(-3,0,6,16);ctx.restore();ctx.save();ctx.translate(13,-15);ctx.rotate(runCycle*0.4);ctx.fillRect(-3,0,6,16);ctx.restore();ctx.fillStyle=player.skinTone;ctx.beginPath();ctx.arc(0,-35,13,0,Math.PI*2);ctx.fill();ctx.fillStyle=player.hairColor;ctx.beginPath();ctx.arc(0,-40,12,Math.PI,Math.PI*2);ctx.fill();ctx.fillRect(-10,-42,20,5);drawFace(player,0,-35)}

function drawSwimmingPlayer(player){const swimCycle=Math.sin(frameNow*0.008);ctx.save();ctx.rotate(Math.PI*0.1);ctx.fillStyle=player.shirtColor;ctx.beginPath();ctx.ellipse(0,5,16,10,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=player.skinTone;ctx.save();ctx.translate(-12,5);ctx.rotate(swimCycle*0.5-0.3);ctx.fillRect(-3,0,6,14);ctx.restore();ctx.save();ctx.translate(12,5);ctx.rotate(-swimCycle*0.5+0.3);ctx.fillRect(-3,0,6,14);ctx.restore();ctx.fillStyle=player.skinTone;ctx.beginPath();ctx.arc(-5,-10,11,0,Math.PI*2);ctx.fill();ctx.fillStyle=player.hairColor;ctx.beginPath();ctx.arc(-5,-14,10,Math.PI,Math.PI*2);ctx.fill();ctx.restore();ctx.strokeStyle='rgba(100,200,255,0.5)';ctx.lineWidth=2;for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,15,20+i*8,0,Math.PI,false);ctx.stroke()}drawFace(player,-5,-10)}
function drawAttackingPlayer(player){const actionIndex=player.currentAction,t=frameNow*0.015;ctx.save();if(player.fightPartner&&player.x>player.fightPartner.x)ctx.scale(-1,1);switch(actionIndex){case 0:drawPunchAttack(player,t);break;case 1:drawKickAttack(player,t);break;case 2:drawHeadbuttAttack(player,t);break;case 3:drawPushAttack(player,t);break;case 4:drawGrabAttack(player,t);break;case 5:drawElbowAttack(player,t);break;default:drawPunchAttack(player,t)}ctx.restore()}
function drawPunchAttack(player,t){const punchExtend=Math.sin(t*8)*0.5+0.5;ctx.fillStyle=player.shirtColor;ctx.beginPath();ctx.ellipse(3,-15,12,16,0.15,0,Math.PI*2);ctx.fill();ctx.fillStyle=player.pantsColor;ctx.fillRect(-8,0,8,20);ctx.fillRect(2,0,8,20);ctx.fillStyle=player.skinTone;ctx.save();ctx.translate(12,-18);ctx.rotate(-0.4+punchExtend*0.3);ctx.fillRect(0,-4,15+punchExtend*20,8);ctx.beginPath();ctx.arc(15+punchExtend*20,0,7,0,Math.PI*2);ctx.fill();ctx.restore();ctx.save();ctx.translate(-10,-15);ctx.rotate(0.8);ctx.fillRect(-3,0,6,14);ctx.restore();ctx.fillStyle=player.skinTone;ctx.beginPath();ctx.arc(2,-35,13,0,Math.PI*2);ctx.fill();ctx.fillStyle=player.hairColor;ctx.beginPath();ctx.arc(2,-40,12,Math.PI,Math.PI*2);ctx.fill();drawFightFace(player,2,-35)}

function drawFace(player,x,y){const expr=player.expression||'normal';ctx.fillStyle='#000';switch(expr){case 'happy':ctx.beginPath();ctx.arc(x-4,y-2,3,0,Math.PI,true);ctx.stroke();ctx.beginPath();ctx.arc(x+4,y-2,3,0,Math.PI,true);ctx.stroke();break;case 'angry':ctx.fillRect(x-6,y-4,5,3);ctx.fillRect(x+1,y-4,5,3);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-7,y-8);ctx.lineTo(x-2,y-6);ctx.stroke();ctx.beginPath();ctx.moveTo(x+7,y-8);ctx.lineTo(x+2,y-6);ctx.stroke();break;case 'hurt':ctx.font='10px Arial';ctx.fillText('X',x-5,y-1);ctx.fillText('X',x+3,y-1);break;case 'surprised':ctx.beginPath();ctx.arc(x-4,y-2,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+4,y-2,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-4,y-3,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+4,y-3,1.5,0,Math.PI*2);ctx.fill();break;default:ctx.beginPath();ctx.arc(x-4,y-2,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+4,y-2,2,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#000';switch(expr){case 'happy':ctx.beginPath();ctx.arc(x,y+4,4,0,Math.PI);ctx.fill();break;case 'angry':ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-4,y+6);ctx.lineTo(x+4,y+4);ctx.stroke();break;case 'hurt':ctx.beginPath();ctx.arc(x,y+5,4,Math.PI,Math.PI*2);ctx.fill();break;case 'surprised':ctx.beginPath();ctx.ellipse(x,y+5,3,5,0,0,Math.PI*2);ctx.fill();break;default:ctx.beginPath();ctx.arc(x,y+4,3,0,Math.PI);ctx.stroke()}}
function updateEffects(deltaTime){dustEffects=dustEffects.filter(d=>{d.x+=d.vx;d.y+=d.vy;d.vy+=0.1;d.life-=deltaTime*2;d.size*=0.98;return d.life>0});sparkEffects=sparkEffects.filter(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=0.15;s.life-=deltaTime*3;return s.life>0});splashEffects=splashEffects.filter(sp=>{sp.x+=sp.vx;sp.y+=sp.vy;sp.vy+=0.2;sp.life-=deltaTime*2.5;return sp.life>0});collisionEffects=collisionEffects.filter(c=>{c.life-=deltaTime*2;c.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.size*=0.97});return c.life>0});shockwaveEffects=shockwaveEffects.filter(sw=>{sw.radius+=8;sw.life-=deltaTime*2;return sw.life>0});hitEffects=hitEffects.filter(h=>{h.life-=deltaTime*3;return h.life>0});itemPopups=itemPopups.filter(ip=>{ip.y-=1.5;ip.life-=deltaTime;return ip.life>0});players.forEach(p=>{if(p.hitFlash>0)p.hitFlash-=deltaTime*3})}
function drawEffects(){dustEffects.forEach(d=>{ctx.fillStyle=d.color.replace(')',',' +d.life+')').replace('rgb','rgba');ctx.beginPath();ctx.arc(d.x,d.y,d.size,0,Math.PI*2);ctx.fill()});sparkEffects.forEach(s=>{ctx.fillStyle=s.color.startsWith('#')?`rgba(255,215,0,${s.life})`:`rgba(255,215,0,${s.life})`;ctx.beginPath();ctx.arc(s.x,s.y,3,0,Math.PI*2);ctx.fill()});splashEffects.forEach(sp=>{ctx.fillStyle=`rgba(100,180,255,${sp.life})`;ctx.beginPath();ctx.arc(sp.x,sp.y,sp.size,0,Math.PI*2);ctx.fill()});collisionEffects.forEach(c=>{c.particles.forEach(p=>{ctx.fillStyle=`rgba(255,100,50,${c.life})`;ctx.beginPath();ctx.arc(c.x+p.x,c.y+p.y,p.size,0,Math.PI*2);ctx.fill()})});shockwaveEffects.forEach(sw=>{ctx.strokeStyle=`rgba(255,255,255,${sw.life*0.5})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(sw.x,sw.y,sw.radius,0,Math.PI*2);ctx.stroke()});itemPopups.forEach(ip=>{ctx.fillStyle=`rgba(255,255,255,${ip.life})`;ctx.font='bold 16px Noto Sans KR';ctx.textAlign='center';ctx.fillText(ip.emoji||'',ip.x,ip.y)})}
function updateLeaderboard(){const sortedPlayers=[...players].sort((a,b)=>{if(a.finished&&b.finished)return a.finishRank-b.finishRank;if(a.finished)return -1;if(b.finished)return 1;return b.progress-a.progress});const rankings=document.getElementById('rankings');rankings.innerHTML=sortedPlayers.map((player,index)=>{const rank=index+1;const status=player.finished?`<span style="color:rgba(0,255,136,0.8)">${T('finTime',{t:player.finishTime.toFixed(1)})}</span>`:`<span style="color:rgba(255,255,255,0.4)">${T('racing')}</span>`;const topClass=rank<=3&&!player.finished?' top3':'';const finClass=player.finished?' finished':'';return `<div class="ranking-item${topClass}${finClass}" style="border-left:3px solid ${player.shirtColor}"><span class="rank-number">${rankLabel(rank)}</span><span class="rank-name">${player.name}</span><span class="rank-status">${status}</span></div>`}).join('')}
function displayCommentary(){const commentaryEl=document.getElementById('commentary');if(currentCommentary){commentaryEl.textContent=currentCommentary.message;commentaryEl.style.display='block'}else commentaryEl.style.display='none'}
function updateTimer(){document.getElementById('timer').textContent=remainingTime.toFixed(1);document.getElementById('centerTimer').textContent=remainingTime.toFixed(1);if(remainingTime<=10){document.getElementById('centerTimer').style.color='rgba(255,51,102,0.8)';document.getElementById('centerTimer').style.animation='timerPulse 0.5s infinite'}}
let lastTime=0;
function gameLoop(currentTime){if(!gameRunning)return;if(gamePaused){animationId=requestAnimationFrame(gameLoop);lastTime=currentTime;return}const deltaTime=Math.min((currentTime-lastTime)/1000,0.1);lastTime=currentTime;frameNow=Date.now();remainingTime-=deltaTime*gameSpeed;raceElapsedTime+=deltaTime*gameSpeed;_timerAccum+=deltaTime;if(_timerAccum>=0.1){_timerAccum=0;updateTimer()}if(remainingTime<=30&&remainingTime+deltaTime*gameSpeed>30){AudioEngine.sfx.warning();}if(remainingTime<=0){endGame();return}updatePlayers(deltaTime);updateEffects(deltaTime);updateCommentary(deltaTime);render();_lbAccum+=deltaTime;if(_lbAccum>=0.3){_lbAccum=0;updateLeaderboard()}animationId=requestAnimationFrame(gameLoop)}
function render(){ctx.clearRect(0,0,WIDTH,HEIGHT);drawBackground();drawScenery();drawTrack();const sortedPlayers=[...players].sort((a,b)=>a.y-b.y);sortedPlayers.forEach(player=>drawPlayer(player));drawEffects();displayCommentary()}
function startGame(){AudioEngine.getCtx();const nameInputs=document.getElementById('playerNameInputs').querySelectorAll('input[type="text"]');const playerCount=nameInputs.length;raceTime=parseInt(document.getElementById('raceTime').value);gameSpeed=parseFloat(document.getElementById('gameSpeed').value);eventFrequency=parseInt(document.getElementById('eventFrequency').value);remainingTime=raceTime;const names=[];nameInputs.forEach((input,i)=>{names.push(input.value.trim()||T('phName',{n:i+1}))});lastRaceNames=[...names];lastRaceCount=playerCount;lastRaceTime=raceTime;lastGameSpeed=gameSpeed;lastEventFreq=eventFrequency;gamePaused=false;document.getElementById('pauseBtn').textContent='⏸️ '+T('pause');document.getElementById('pauseBtn').classList.remove('resumed');document.getElementById('pauseOverlay').style.display='none';document.getElementById('setupScreen').style.display='none';document.body.classList.add('race-active');/* In portrait on a phone the race can't display correctly; show the rotate
