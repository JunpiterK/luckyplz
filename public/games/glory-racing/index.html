<script>
/* ===== 8-BIT AUDIO ENGINE ===== */
const AudioEngine = (function(){
    let actx = null, bgmPlaying = false, bgmEnabled = true, masterGain = null;
    let bgmOscillators = [], bgmInterval = null;

    function getCtx(){
        if(!actx){
            actx = new (window.AudioContext || window.webkitAudioContext)();
            masterGain = actx.createGain();
            masterGain.gain.value = 0.35;
            masterGain.connect(actx.destination);
        }
        if(actx.state === 'suspended') actx.resume();
        return actx;
    }

    function playSFX(freq, duration, type, volume, slide){
        try{
            const c = getCtx();
            const osc = c.createOscillator();
            const g = c.createGain();
            osc.type = type || 'square';
            osc.frequency.setValueAtTime(freq, c.currentTime);
            if(slide) osc.frequency.linearRampToValueAtTime(slide, c.currentTime + duration);
            g.gain.setValueAtTime((volume||0.15)*0.6, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
            osc.connect(g);
            g.connect(masterGain);
            osc.start(c.currentTime);
            osc.stop(c.currentTime + duration);
        }catch(e){}
    }

    function playNoise(duration, volume){
        try{
            const c = getCtx();
            const bufferSize = c.sampleRate * duration;
            const buffer = c.createBuffer(1, bufferSize, c.sampleRate);
            const data = buffer.getChannelData(0);
            for(let i=0;i<bufferSize;i++) data[i]=(Math.random()*2-1);
            const src = c.createBufferSource();
            src.buffer = buffer;
            const g = c.createGain();
            g.gain.setValueAtTime((volume||0.08)*0.5, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + duration);
            src.connect(g);
            g.connect(masterGain);
            src.start(c.currentTime);
        }catch(e){}
    }

    const sfx = {
        countdown: function(){
            playSFX(880, 0.15, 'square', 0.18);
            setTimeout(()=>playSFX(880, 0.08, 'square', 0.1), 80);
        },
        go: function(){
            playSFX(523, 0.08, 'square', 0.2);
            setTimeout(()=>playSFX(659, 0.08, 'square', 0.2), 80);
            setTimeout(()=>playSFX(784, 0.08, 'square', 0.2), 160);
            setTimeout(()=>playSFX(1047, 0.25, 'square', 0.25), 240);
        },
        punch: function(){
            playNoise(0.08, 0.2);
            playSFX(200, 0.1, 'square', 0.15, 80);
        },
        kick: function(){
            playNoise(0.1, 0.22);
            playSFX(150, 0.12, 'sawtooth', 0.12, 60);
        },
        fightStart: function(){
            playSFX(330, 0.06, 'square', 0.18);
            setTimeout(()=>playSFX(440, 0.06, 'square', 0.18), 70);
            setTimeout(()=>playSFX(550, 0.1, 'square', 0.2), 140);
        },
        fightEnd: function(){
            playSFX(600, 0.15, 'square', 0.18, 200);
            setTimeout(()=>playNoise(0.15, 0.15), 50);
        },
        itemGet: function(){
            playSFX(660, 0.06, 'square', 0.18);
            setTimeout(()=>playSFX(880, 0.06, 'square', 0.18), 70);
            setTimeout(()=>playSFX(1100, 0.12, 'square', 0.2), 140);
        },
        boost: function(){
            playSFX(400, 0.3, 'sawtooth', 0.15, 1200);
        },
        stun: function(){
            playSFX(300, 0.3, 'square', 0.15, 100);
            setTimeout(()=>playSFX(250, 0.2, 'square', 0.1, 80), 100);
        },
        slow: function(){
            playSFX(500, 0.4, 'triangle', 0.12, 150);
        },
        splash: function(){
            playNoise(0.2, 0.12);
            playSFX(400, 0.15, 'sine', 0.08, 200);
        },
        jump: function(){
            playSFX(250, 0.2, 'square', 0.12, 600);
        },
        finish: function(){
            const notes = [523,659,784,1047,784,1047,1319];
            notes.forEach((n,i)=>{
                setTimeout(()=>playSFX(n, 0.15, 'square', 0.2), i*100);
            });
        },
        gameEnd: function(){
            const melody = [523,0,659,0,784,0,1047,1047,0,784,1047,1319,1568];
            melody.forEach((n,i)=>{
                if(n>0) setTimeout(()=>playSFX(n, 0.2, 'square', 0.22), i*120);
            });
        },
        trip: function(){
            playSFX(300, 0.15, 'square', 0.1, 100);
            setTimeout(()=>playNoise(0.08, 0.1), 80);
        },
        iceSlip: function(){
            playSFX(500, 0.12, 'sine', 0.12, 200);
            setTimeout(()=>playSFX(300, 0.15, 'square', 0.1, 100), 60);
            setTimeout(()=>playNoise(0.08, 0.1), 120);
        },
        warning: function(){
            playSFX(880, 0.1, 'square', 0.15);
            setTimeout(()=>playSFX(660, 0.1, 'square', 0.15), 150);
        }
    };

    const BGM_BPM = 312;
    const BEAT = 60 / BGM_BPM;

    const melodyPattern = [
        494,440,415,440, 523,0,523,0,  587,523,494,523, 659,0,659,0,
        698,659,622,659, 988,880,831,880, 1047,0,988,880, 831,880,523,0,
        494,440,415,440, 523,0,523,0,  587,523,494,523, 659,0,659,0,
        698,659,622,659, 988,880,831,880, 1047,988,880,0, 880,0,0,0,
        880,0,1047,880, 659,0,880,0,  1047,0,1175,1047, 880,0,659,0,
        880,0,1047,880, 659,0,880,0,  1047,1175,1319,1175, 1047,880,659,0,
        1319,1175,1047,880, 784,659,523,440, 523,587,659,784, 880,988,1047,0,
        880,784,659,523, 440,415,440,523, 659,523,440,0,  880,0,0,0
    ];

    const bassPattern = [
        110,0,110,165, 131,0,131,0,  147,0,147,165, 165,0,165,0,
        175,0,175,131, 165,0,165,0,  110,0,131,165, 110,0,110,0,
        110,0,110,165, 131,0,131,0,  147,0,147,165, 165,0,165,0,
        175,0,175,131, 165,0,165,0,  110,0,165,131, 110,0,110,0,
        220,0,220,165, 131,0,220,0,  220,0,220,165, 131,0,165,0,
        220,0,220,165, 131,0,220,0,  220,0,175,165, 131,165,131,0,
        220,175,165,131, 110,131,110,0, 110,0,131,147, 165,175,220,0,
        165,131,110,131, 110,0,110,131, 165,131,110,0, 220,0,110,0
    ];

    const arpeggioPattern = [
        220,262,330,262, 262,330,392,330, 294,349,440,349, 330,415,494,415,
        349,440,523,440, 330,415,494,415, 262,330,392,415, 262,330,262,220,
        220,262,330,262, 262,330,392,330, 294,349,440,349, 330,415,494,415,
        349,440,523,440, 330,415,494,415, 262,330,440,330, 220,262,220,0,
        440,523,659,523, 330,440,523,440, 440,523,659,523, 330,440,523,440,
        440,523,659,523, 330,440,523,440, 440,523,587,523, 440,330,262,0,
        440,523,659,440, 330,262,220,175, 220,262,330,392, 440,494,523,440,
        330,262,220,262, 220,0,220,262, 330,262,220,0,  440,330,220,0
    ];

    const drumPattern = [
        1,3,2,3, 1,3,2,3, 1,3,2,3, 1,3,2,3,
        1,3,2,3, 1,3,2,3, 1,3,2,3, 1,1,2,2,
        1,3,2,3, 1,3,2,3, 1,3,2,3, 1,3,2,3,
        1,3,2,3, 1,3,2,3, 1,3,2,3, 1,1,2,2,
        1,3,2,3, 1,3,1,3, 1,3,2,3, 1,3,1,3,
        1,3,2,3, 1,3,1,3, 1,3,2,3, 1,1,1,2,
        1,3,2,3, 1,3,2,3, 1,3,2,3, 1,3,2,3,
        1,3,2,3, 1,1,2,3, 1,3,2,3, 1,2,1,2
    ];

    let bgmStep = 0;

    function playBGMStep(){
        if(!bgmEnabled || !bgmPlaying) return;
        const c = getCtx();
        const idx = bgmStep % melodyPattern.length;

        const melNote = melodyPattern[idx];
        if(melNote > 0){
            const osc = c.createOscillator();
            const g = c.createGain();
            osc.type = 'square';
            osc.frequency.value = melNote;
            g.gain.setValueAtTime(0.09, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + BEAT*0.85);
            osc.connect(g); g.connect(masterGain);
            osc.start(c.currentTime); osc.stop(c.currentTime + BEAT*0.9);
        }

        const bassNote = bassPattern[idx];
        if(bassNote > 0){
            const osc = c.createOscillator();
            const g = c.createGain();
            osc.type = 'triangle';
            osc.frequency.value = bassNote;
            g.gain.setValueAtTime(0.12, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + BEAT*0.8);
            osc.connect(g); g.connect(masterGain);
            osc.start(c.currentTime); osc.stop(c.currentTime + BEAT*0.85);
        }

        const arpNote = arpeggioPattern[idx];
        if(arpNote > 0){
            const osc = c.createOscillator();
            const g = c.createGain();
            osc.type = 'square';
            osc.frequency.value = arpNote;
            g.gain.setValueAtTime(0.04, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + BEAT*0.5);
            osc.connect(g); g.connect(masterGain);
            osc.start(c.currentTime); osc.stop(c.currentTime + BEAT*0.55);
        }

        const drum = drumPattern[idx];
        if(drum === 1){
            const osc = c.createOscillator();
            const g = c.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, c.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, c.currentTime + 0.1);
            g.gain.setValueAtTime(0.2, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.12);
            osc.connect(g); g.connect(masterGain);
            osc.start(c.currentTime); osc.stop(c.currentTime + 0.12);
        } else if(drum === 2){
            const bufLen = Math.floor(c.sampleRate * 0.06);
            const buf = c.createBuffer(1, bufLen, c.sampleRate);
            const d = buf.getChannelData(0);
            for(let i=0;i<bufLen;i++) d[i]=Math.random()*2-1;
            const src = c.createBufferSource();
            src.buffer = buf;
            const g = c.createGain();
            g.gain.setValueAtTime(0.14, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.06);
            const flt = c.createBiquadFilter();
            flt.type = 'highpass'; flt.frequency.value = 2000;
            src.connect(flt); flt.connect(g); g.connect(masterGain);
            src.start(c.currentTime);
        } else if(drum === 3){
            const bufLen = Math.floor(c.sampleRate * 0.02);
            const buf = c.createBuffer(1, bufLen, c.sampleRate);
            const d = buf.getChannelData(0);
            for(let i=0;i<bufLen;i++) d[i]=Math.random()*2-1;
            const src = c.createBufferSource();
            src.buffer = buf;
            const g = c.createGain();
            g.gain.setValueAtTime(0.06, c.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + 0.02);
            const flt = c.createBiquadFilter();
            flt.type = 'highpass'; flt.frequency.value = 7000;
            src.connect(flt); flt.connect(g); g.connect(masterGain);
            src.start(c.currentTime);
        }

        bgmStep++;
    }

    function startBGM(){
        if(bgmPlaying) return;
        bgmPlaying = true;
        bgmStep = 0;
        const intervalMs = BEAT * 1000;
        bgmInterval = setInterval(playBGMStep, intervalMs);
    }

    function stopBGM(){
        bgmPlaying = false;
        if(bgmInterval){ clearInterval(bgmInterval); bgmInterval = null; }
    }

    function toggleBGM(){
        bgmEnabled = !bgmEnabled;
        if(!bgmEnabled) stopBGM();
        return bgmEnabled;
    }

    function isBGMEnabled(){ return bgmEnabled; }
    function isBGMPlaying(){ return bgmPlaying; }

    return { sfx, startBGM, stopBGM, toggleBGM, isBGMEnabled, isBGMPlaying, getCtx };
})();

document.getElementById('soundToggle').addEventListener('click', function(){
    const enabled = AudioEngine.toggleBGM();
    this.textContent = enabled ? '🔊 BGM ON' : '🔇 BGM OFF';
    if(enabled && gameRunning && !gamePaused){
        AudioEngine.startBGM();
    }

function generateSnakeTrack(){track=[];const rows=5,usableHeight=HEIGHT-MARGIN*2,rowHeight=usableHeight/(rows-1);let points=[];for(let row=0;row<rows;row++){const y=MARGIN+row*rowHeight,goingRight=row%2===0;if(goingRight){points.push({x:MARGIN,y:y});points.push({x:WIDTH-RIGHT_MARGIN,y:y})}else{points.push({x:WIDTH-RIGHT_MARGIN,y:y});points.push({x:MARGIN,y:y})}}const segments=250;for(let i=0;i<segments;i++){const t=i/(segments-1),totalLength=points.length-1,segment=Math.min(Math.floor(t*totalLength),totalLength-1),localT=(t*totalLength)-segment;const p0=points[Math.max(0,segment-1)],p1=points[segment],p2=points[Math.min(totalLength,segment+1)],p3=points[Math.min(totalLength,segment+2)];const point=catmullRom(p0,p1,p2,p3,localT);point.x=clamp(point.x,MARGIN,WIDTH-RIGHT_MARGIN);point.y=clamp(point.y,MARGIN,HEIGHT-MARGIN);track.push({x:point.x,y:point.y,index:i})}generateZones();generateTrackObstacles();generateItemBoxes();generateScenery()}

/* ===== [FIX v3.0] 존 배치 - 교대 균등 배치 (Hill/Water/Mud 각 2회) ===== */
/* 트랙 위치 배치도 (교대):
   0.08 Hill | 0.22 Water | 0.36 Mud | 0.50 Hill | 0.64 Water | 0.78 Mud
   Ice: 0.46, 0.86  |  Boost: 0.15, 0.57 */
function generateZones(){
    deepWaterZones=[];hillZones=[];mudZones=[];iceZones=[];boostZones=[];
    const waterLength=Math.floor(track.length*0.056);
    const hillLength=15;
    const mudLength=10;
    const GAP=12;

    /* 교대 배치: Hill→Water→Mud→Hill→Water→Mud */
    const hazardSlots=[
        {type:'hill',  pos:0.08},
        {type:'water', pos:0.22},
        {type:'mud',   pos:0.36},
        {type:'hill',  pos:0.50},
        {type:'water', pos:0.64},
        {type:'mud',   pos:0.78}
    ];

    hazardSlots.forEach(slot=>{
        let start=Math.floor(track.length*slot.pos);
        switch(slot.type){
            case 'water':
                if(!isOverlappingAnyZone(start, start+waterLength))
                    deepWaterZones.push({start:start, end:start+waterLength, width:TRACK_WIDTH+25});
                break;
            case 'hill':
                if(!isOverlappingAnyZone(start, start+hillLength))
                    hillZones.push({start:start, end:start+hillLength, height:35+Math.random()*15});
                break;
            case 'mud':
                if(isOverlappingAnyZone(start, start+mudLength)){
                    start+=GAP;
                    if(isOverlappingAnyZone(start, start+mudLength)) start-=GAP*2;
                }
                if(start>15 && start+mudLength<track.length-15 && !isOverlappingAnyZone(start, start+mudLength))
                    mudZones.push({start:start, end:start+mudLength, width:TRACK_WIDTH});
                break;
        }
    });

    /* Ice */
    [0.46, 0.86].forEach(pos=>{
        let start=Math.floor(track.length*pos);
        if(isOverlappingAnyZone(start, start+8)){
            start+=GAP;
            if(isOverlappingAnyZone(start, start+8)) start-=GAP*2;
        }
        if(start>15 && start+8<track.length-15 && !isOverlappingAnyZone(start, start+8))
            iceZones.push({start:start, end:start+8, width:TRACK_WIDTH});
    });

    /* Boost */
    [0.15, 0.57].forEach(pos=>{
        let start=Math.floor(track.length*pos);
        if(isOverlappingAnyZone(start, start+6)){
            start+=GAP;
            if(isOverlappingAnyZone(start, start+6)) start-=GAP*2;
        }
        if(start>10 && start+6<track.length-10 && !isOverlappingAnyZone(start, start+6))
            boostZones.push({start:start, end:start+6, width:TRACK_WIDTH*0.6});
    });
}

function isOverlappingWater(start,end){return deepWaterZones.some(z=>start<z.end+20&&end>z.start-20)}
function isOverlappingAnyZone(start,end){return isOverlappingWater(start,end)||hillZones.some(z=>start<z.end+15&&end>z.start-15)||mudZones.some(z=>start<z.end+15&&end>z.start-15)||iceZones.some(z=>start<z.end+15&&end>z.start-15)||boostZones.some(z=>start<z.end+15&&end>z.start-15)}

function generateTrackObstacles(){trackObstacles=[];const numObstacles=25;for(let i=0;i<numObstacles;i++){const trackPos=Math.floor(35+(i/numObstacles)*(track.length-70));if(isOverlappingAnyZone(trackPos-3,trackPos+3))continue;const types=['rock','cone','barrel','hurdle','hurdle','tire'];const type=types[randomInt(0,types.length-1)];trackObstacles.push({trackPos:trackPos,type:type,size:type==='hurdle'?40:22+Math.random()*20,offsetX:(Math.random()-0.5)*70,offsetY:(Math.random()-0.5)*15,rotation:Math.random()*Math.PI*2})}}

function drawPushAttack(player,t){const pushPhase=Math.sin(t*6),extend=pushPhase*0.5+0.5;ctx.fillStyle=player.shirtColor;ctx.save();ctx.rotate(0.1);ctx.beginPath();ctx.ellipse(extend*5,-15,12,16,0,0,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle=player.pantsColor;ctx.save();ctx.translate(-5,0);ctx.rotate(-0.3-extend*0.2);ctx.fillRect(-4,0,8,22);ctx.restore();ctx.save();ctx.translate(5,0);ctx.rotate(0.2);ctx.fillRect(-4,0,8,22);ctx.restore();ctx.fillStyle=player.skinTone;ctx.save();ctx.translate(-8+extend*5,-18);ctx.rotate(-0.3);ctx.fillRect(0,-3,12+extend*18,6);ctx.fillRect(12+extend*18,-5,10,10);ctx.restore();ctx.save();ctx.translate(8+extend*5,-12);ctx.rotate(0.3);ctx.fillRect(0,-3,12+extend*18,6);ctx.fillRect(12+extend*18,-5,10,10);ctx.restore();ctx.fillStyle=player.skinTone;ctx.beginPath();ctx.arc(extend*3,-35,13,0,Math.PI*2);ctx.fill();ctx.fillStyle=player.hairColor;ctx.beginPath();ctx.arc(extend*3,-40,12,Math.PI,Math.PI*2);ctx.fill();drawFightFace(player,extend*3,-35)}

function drawMudPlayer(player){const sinkLevel=Math.min(player.stateTimer*0.5,0.4);ctx.save();ctx.translate(0,sinkLevel*20);ctx.fillStyle=player.shirtColor;ctx.beginPath();ctx.ellipse(0,-15,12,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#6B4423';ctx.fillRect(-8,5,16,20);ctx.fillStyle=player.skinTone;const armWave=Math.sin(frameNow*0.01);ctx.save();ctx.translate(-13,-15);ctx.rotate(-0.5+armWave*0.4);ctx.fillRect(-3,0,6,16);ctx.restore();ctx.save();ctx.translate(13,-15);ctx.rotate(0.5-armWave*0.4);ctx.fillRect(-3,0,6,16);ctx.restore();ctx.fillStyle=player.skinTone;ctx.beginPath();ctx.arc(0,-35,13,0,Math.PI*2);ctx.fill();ctx.fillStyle=player.hairColor;ctx.beginPath();ctx.arc(0,-40,12,Math.PI,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#8B5A2B';for(let i=0;i<5;i++){const mx=(Math.random()-0.5)*40,my=10+Math.random()*15;ctx.beginPath();ctx.arc(mx,my,3+Math.random()*3,0,Math.PI*2);ctx.fill()}player.expression='surprised';drawFace(player,0,-35+sinkLevel*20)}
function drawSlidingPlayer(player){ctx.save();ctx.rotate(Math.sin(frameNow*0.02)*0.2);ctx.fillStyle=player.shirtColor;ctx.beginPath();ctx.ellipse(0,-10,12,16,0.3,0,Math.PI*2);ctx.fill();ctx.fillStyle=player.pantsColor;ctx.save();ctx.translate(0,5);ctx.rotate(0.4);ctx.fillRect(-4,0,8,22);ctx.restore();ctx.save();ctx.translate(8,5);ctx.rotate(-0.2);ctx.fillRect(-4,0,8,22);ctx.restore();ctx.fillStyle=player.skinTone;ctx.save();ctx.translate(-13,-10);ctx.rotate(-Math.PI*0.4);ctx.fillRect(-3,0,6,16);ctx.restore();ctx.save();ctx.translate(13,-10);ctx.rotate(Math.PI*0.4);ctx.fillRect(-3,0,6,16);ctx.restore();ctx.fillStyle=player.skinTone;ctx.beginPath();ctx.arc(0,-30,13,0,Math.PI*2);ctx.fill();ctx.fillStyle=player.hairColor;ctx.beginPath();ctx.arc(0,-35,12,Math.PI,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='rgba(200,230,255,0.7)';for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(Math.sin(frameNow*0.01+i)*25,20+Math.random()*10,2+Math.random()*2,0,Math.PI*2);ctx.fill()}player.expression='surprised';drawFace(player,0,-30)}
function drawCelebratingPlayer(player){const celebPhase=Math.sin(frameNow*0.008),jumpY=-Math.abs(celebPhase)*15;ctx.save();ctx.translate(0,jumpY);ctx.fillStyle=player.shirtColor;ctx.beginPath();ctx.ellipse(0,-15,12,16,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=player.pantsColor;ctx.save();ctx.translate(-5,0);ctx.rotate(-0.3);ctx.fillRect(-4,0,8,20);ctx.restore();ctx.save();ctx.translate(5,0);ctx.rotate(0.3);ctx.fillRect(-4,0,8,20);ctx.restore();ctx.fillStyle=player.skinTone;ctx.save();ctx.translate(-13,-20);ctx.rotate(-Math.PI*0.7+celebPhase*0.2);ctx.fillRect(-3,0,6,18);ctx.restore();ctx.save();ctx.translate(13,-20);ctx.rotate(Math.PI*0.7-celebPhase*0.2);ctx.fillRect(-3,0,6,18);ctx.restore();ctx.fillStyle=player.skinTone;ctx.beginPath();ctx.arc(0,-35,13,0,Math.PI*2);ctx.fill();ctx.fillStyle=player.hairColor;ctx.beginPath();ctx.arc(0,-40,12,Math.PI,Math.PI*2);ctx.fill();ctx.restore();ctx.fillStyle='#FFD700';for(let i=0;i<8;i++){const confX=Math.sin(frameNow*0.003+i*0.8)*40,confY=-50-Math.cos(frameNow*0.005+i)*30+jumpY;const colors=['#FFD700','#FF6B6B','#4ECDC4','#95E1D3','#F38181'];ctx.fillStyle=colors[i%colors.length];ctx.fillRect(confX-3,confY-3,6,6)}player.expression='happy';drawFace(player,0,-35+jumpY)}
function drawFace(player,x,y){const expr=player.expression||'normal';ctx.fillStyle='#000';switch(expr){case 'happy':ctx.beginPath();ctx.arc(x-4,y-2,3,0,Math.PI,true);ctx.stroke();ctx.beginPath();ctx.arc(x+4,y-2,3,0,Math.PI,true);ctx.stroke();break;case 'angry':ctx.fillRect(x-6,y-4,5,3);ctx.fillRect(x+1,y-4,5,3);ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-7,y-8);ctx.lineTo(x-2,y-6);ctx.stroke();ctx.beginPath();ctx.moveTo(x+7,y-8);ctx.lineTo(x+2,y-6);ctx.stroke();break;case 'hurt':ctx.font='10px Arial';ctx.fillText('X',x-5,y-1);ctx.fillText('X',x+3,y-1);break;case 'surprised':ctx.beginPath();ctx.arc(x-4,y-2,4,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+4,y-2,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-4,y-3,1.5,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+4,y-3,1.5,0,Math.PI*2);ctx.fill();break;default:ctx.beginPath();ctx.arc(x-4,y-2,2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(x+4,y-2,2,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#000';switch(expr){case 'happy':ctx.beginPath();ctx.arc(x,y+4,4,0,Math.PI);ctx.fill();break;case 'angry':ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-4,y+6);ctx.lineTo(x+4,y+4);ctx.stroke();break;case 'hurt':ctx.beginPath();ctx.arc(x,y+5,4,Math.PI,Math.PI*2);ctx.fill();break;case 'surprised':ctx.beginPath();ctx.ellipse(x,y+5,3,5,0,0,Math.PI*2);ctx.fill();break;default:ctx.beginPath();ctx.arc(x,y+4,3,0,Math.PI);ctx.stroke()}}
function updateEffects(deltaTime){dustEffects=dustEffects.filter(d=>{d.x+=d.vx;d.y+=d.vy;d.vy+=0.1;d.life-=deltaTime*2;d.size*=0.98;return d.life>0});sparkEffects=sparkEffects.filter(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=0.15;s.life-=deltaTime*3;return s.life>0});splashEffects=splashEffects.filter(sp=>{sp.x+=sp.vx;sp.y+=sp.vy;sp.vy+=0.2;sp.life-=deltaTime*2.5;return sp.life>0});collisionEffects=collisionEffects.filter(c=>{c.life-=deltaTime*2;c.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.15;p.size*=0.97});return c.life>0});shockwaveEffects=shockwaveEffects.filter(sw=>{sw.radius+=8;sw.life-=deltaTime*2;return sw.life>0});hitEffects=hitEffects.filter(h=>{h.life-=deltaTime*3;return h.life>0});itemPopups=itemPopups.filter(ip=>{ip.y-=1.5;ip.life-=deltaTime;return ip.life>0});players.forEach(p=>{if(p.hitFlash>0)p.hitFlash-=deltaTime*3})}
function drawEffects(){dustEffects.forEach(d=>{ctx.fillStyle=d.color.replace(')',',' +d.life+')').replace('rgb','rgba');ctx.beginPath();ctx.arc(d.x,d.y,d.size,0,Math.PI*2);ctx.fill()});sparkEffects.forEach(s=>{ctx.fillStyle=s.color.startsWith('#')?`rgba(255,215,0,${s.life})`:`rgba(255,215,0,${s.life})`;ctx.beginPath();ctx.arc(s.x,s.y,3,0,Math.PI*2);ctx.fill()});splashEffects.forEach(sp=>{ctx.fillStyle=`rgba(100,180,255,${sp.life})`;ctx.beginPath();ctx.arc(sp.x,sp.y,sp.size,0,Math.PI*2);ctx.fill()});collisionEffects.forEach(c=>{c.particles.forEach(p=>{ctx.fillStyle=`rgba(255,100,50,${c.life})`;ctx.beginPath();ctx.arc(c.x+p.x,c.y+p.y,p.size,0,Math.PI*2);ctx.fill()})});shockwaveEffects.forEach(sw=>{ctx.strokeStyle=`rgba(255,255,255,${sw.life*0.5})`;ctx.lineWidth=3;ctx.beginPath();ctx.arc(sw.x,sw.y,sw.radius,0,Math.PI*2);ctx.stroke()});itemPopups.forEach(ip=>{ctx.fillStyle=`rgba(255,255,255,${ip.life})`;ctx.font='bold 16px Noto Sans KR';ctx.textAlign='center';ctx.fillText(ip.emoji||'',ip.x,ip.y)})}
function updateLeaderboard(){const sortedPlayers=[...players].sort((a,b)=>{if(a.finished&&b.finished)return a.finishRank-b.finishRank;if(a.finished)return -1;if(b.finished)return 1;return b.progress-a.progress});const rankings=document.getElementById('rankings');rankings.innerHTML=sortedPlayers.map((player,index)=>{const rank=index+1;const status=player.finished?`<span style="color:rgba(0,255,136,0.8)">완주 ${player.finishTime.toFixed(1)}s</span>`:`<span style="color:rgba(255,255,255,0.4)">레이싱 중</span>`;const topClass=rank<=3&&!player.finished?' top3':'';const finClass=player.finished?' finished':'';return `<div class="ranking-item${topClass}${finClass}" style="border-left:3px solid ${player.shirtColor}"><span class="rank-number">${rank}위</span><span class="rank-name">${player.name}</span><span class="rank-status">${status}</span></div>`}).join('')}
function displayCommentary(){const commentaryEl=document.getElementById('commentary');if(currentCommentary){commentaryEl.textContent=currentCommentary.message;commentaryEl.style.display='block'}else commentaryEl.style.display='none'}
function updateTimer(){document.getElementById('timer').textContent=remainingTime.toFixed(1);document.getElementById('centerTimer').textContent=remainingTime.toFixed(1);if(remainingTime<=10){document.getElementById('centerTimer').style.color='rgba(255,51,102,0.8)';document.getElementById('centerTimer').style.animation='timerPulse 0.5s infinite'}}
let lastTime=0;
function gameLoop(currentTime){if(!gameRunning)return;if(gamePaused){animationId=requestAnimationFrame(gameLoop);lastTime=currentTime;return}const deltaTime=Math.min((currentTime-lastTime)/1000,0.1);lastTime=currentTime;frameNow=Date.now();remainingTime-=deltaTime*gameSpeed;raceElapsedTime+=deltaTime*gameSpeed;_timerAccum+=deltaTime;if(_timerAccum>=0.1){_timerAccum=0;updateTimer()}if(remainingTime<=30&&remainingTime+deltaTime*gameSpeed>30){AudioEngine.sfx.warning();}if(remainingTime<=0){endGame();return}updatePlayers(deltaTime);updateEffects(deltaTime);updateCommentary(deltaTime);render();_lbAccum+=deltaTime;if(_lbAccum>=0.3){_lbAccum=0;updateLeaderboard()}animationId=requestAnimationFrame(gameLoop)}
function render(){ctx.clearRect(0,0,WIDTH,HEIGHT);drawBackground();drawScenery();drawTrack();const sortedPlayers=[...players].sort((a,b)=>a.y-b.y);sortedPlayers.forEach(player=>drawPlayer(player));drawEffects();displayCommentary()}
function startGame(){AudioEngine.getCtx();const nameInputs=document.getElementById('playerNameInputs').querySelectorAll('input[type="text"]');const playerCount=nameInputs.length;raceTime=parseInt(document.getElementById('raceTime').value);gameSpeed=parseFloat(document.getElementById('gameSpeed').value);eventFrequency=parseInt(document.getElementById('eventFrequency').value);remainingTime=raceTime;const names=[];nameInputs.forEach((input,i)=>{names.push(input.value.trim()||`참가자${i+1}`)});lastRaceNames=[...names];lastRaceCount=playerCount;lastRaceTime=raceTime;lastGameSpeed=gameSpeed;lastEventFreq=eventFrequency;gamePaused=false;document.getElementById('pauseBtn').textContent='⏸️ 일시정지';document.getElementById('pauseBtn').classList.remove('resumed');document.getElementById('pauseOverlay').style.display='none';WIDTH=window.innerWidth;HEIGHT=window.innerHeight;canvas.width=WIDTH;canvas.height=HEIGHT;generateSnakeTrack();players=[];for(let i=0;i<playerCount;i++)players.push(createPlayer(i,names[i]));finishOrder=[];_endGameScheduled=false;fightPairs=[];collisionEffects=[];shockwaveEffects=[];dustEffects=[];sparkEffects=[];splashEffects=[];hitEffects=[];itemPopups=[];commentaryQueue=[];currentCommentary=null;fightsOccurred=0;totalFightsRequired=Math.ceil(playerCount*0.8);raceElapsedTime=0;document.getElementById('totalCount').textContent=playerCount;document.getElementById('finishedCount').textContent='0';document.getElementById('setupScreen').style.display='none';document.getElementById('infoPanel').style.display='flex';document.getElementById('resultScreen').style.display='none';document.getElementById('centerTimer').style.display='block';document.getElementById('centerTimer').textContent=raceTime.toFixed(1);document.getElementById('timer').textContent=raceTime.toFixed(1);document.getElementById('centerTimer').style.color='rgba(255,230,109,0.7)';document.getElementById('centerTimer').style.animation='titleGlow 2s ease-in-out infinite';showCountdown(()=>{gameRunning=true;lastTime=performance.now();addCommentary('raceStart',{});if(AudioEngine.isBGMEnabled()) AudioEngine.startBGM();animationId=requestAnimationFrame(gameLoop)})}
function showCountdown(callback){const countdownEl=document.getElementById('countdown');countdownEl.style.display='flex';const counts=['3','2','1','🚀 GO!'];let index=0;render();function showNext(){if(index>=counts.length){countdownEl.style.display='none';callback();return}countdownEl.textContent=counts[index];countdownEl.style.animation='none';countdownEl.offsetHeight;countdownEl.style.animation='countdownPop 0.8s ease-out';if(index<3) AudioEngine.sfx.countdown(); else AudioEngine.sfx.go();index++;setTimeout(showNext,800)}showNext()}
function endGame(){gameRunning=false;cancelAnimationFrame(animationId);AudioEngine.stopBGM();AudioEngine.sfx.gameEnd();const unfinished=players.filter(p=>!p.finished).sort((a,b)=>b.progress-a.progress);unfinished.forEach(player=>{player.finishRank=finishOrder.length+1;finishOrder.push(player)});showResults()}
function showResults(){document.getElementById('infoPanel').style.display='none';document.getElementById('centerTimer').style.display='none';document.getElementById('commentary').style.display='none';document.getElementById('fightLabelsContainer').innerHTML='';const resultScreen=document.getElementById('resultScreen');resultScreen.style.display='flex';const finalRankings=document.getElementById('finalRankings');finalRankings.innerHTML=finishOrder.map((player,index)=>{const rank=index+1;const time=player.finished?`완주 ${player.finishTime.toFixed(2)}초`:`미완주`;const rankClass=rank===1?'gold':rank===2?'silver':rank===3?'bronze':'';return `<div class="final-rank ${rankClass}"><span class="final-rank-number">${rank}위</span><span class="player-color" style="background:${player.shirtColor}"></span><span class="player-name">${player.name}</span><span class="player-time">${time}</span></div>`}).join('')}
function resetGame(){gameRunning=false;gamePaused=false;AudioEngine.stopBGM();if(animationId)cancelAnimationFrame(animationId);players=[];track=[];trackObstacles=[];deepWaterZones=[];hillZones=[];mudZones=[];iceZones=[];boostZones=[];itemBoxes=[];sceneryObjects=[];finishOrder=[];fightPairs=[];collisionEffects=[];shockwaveEffects=[];dustEffects=[];sparkEffects=[];splashEffects=[];hitEffects=[];itemPopups=[];commentaryQueue=[];currentCommentary=null;fightsOccurred=0;raceElapsedTime=0;document.getElementById('resultScreen').style.display='none';document.getElementById('infoPanel').style.display='none';document.getElementById('centerTimer').style.display='none';document.getElementById('commentary').style.display='none';document.getElementById('fightLabelsContainer').innerHTML='';document.getElementById('pauseOverlay').style.display='none';ctx.clearRect(0,0,WIDTH,HEIGHT);if(lastRaceCount>0&&lastRaceNames.length>0){document.getElementById('playerCount').value=lastRaceCount;document.getElementById('playerCountValue').textContent=lastRaceCount;document.getElementById('raceTime').value=lastRaceTime;document.getElementById('raceTimeValue').textContent=lastRaceTime;document.getElementById('gameSpeed').value=lastGameSpeed;document.getElementById('gameSpeedValue').textContent=lastGameSpeed;document.getElementById('eventFrequency').value=lastEventFreq;document.getElementById('eventFrequencyValue').textContent=lastEventFreq;raceTime=lastRaceTime;remainingTime=lastRaceTime;gameSpeed=lastGameSpeed;eventFrequency=lastEventFreq;generatePlayerNameInputs();for(let i=0;i<lastRaceNames.length&&i<lastRaceCount;i++){const input=document.getElementById(`playerName${i}`);if(input)input.value=lastRaceNames[i]}}else{document.getElementById('playerCount').value=6;document.getElementById('playerCountValue').textContent='6';document.getElementById('raceTime').value=90;document.getElementById('raceTimeValue').textContent='90';document.getElementById('gameSpeed').value=1;document.getElementById('gameSpeedValue').textContent='1';document.getElementById('eventFrequency').value=3;document.getElementById('eventFrequencyValue').textContent='3';raceTime=90;remainingTime=90;gameSpeed=1;eventFrequency=3;generatePlayerNameInputs()}showSaveIndicator();document.getElementById('setupScreen').style.display='flex'}
function exitGame(){gameRunning=false;gamePaused=false;AudioEngine.stopBGM();if(animationId)cancelAnimationFrame(animationId);players=[];track=[];trackObstacles=[];deepWaterZones=[];hillZones=[];mudZones=[];iceZones=[];boostZones=[];itemBoxes=[];sceneryObjects=[];finishOrder=[];fightPairs=[];collisionEffects=[];shockwaveEffects=[];dustEffects=[];sparkEffects=[];splashEffects=[];hitEffects=[];itemPopups=[];commentaryQueue=[];currentCommentary=null;fightsOccurred=0;raceElapsedTime=0;document.getElementById('resultScreen').style.display='none';document.getElementById('infoPanel').style.display='none';document.getElementById('centerTimer').style.display='none';document.getElementById('commentary').style.display='none';document.getElementById('fightLabelsContainer').innerHTML='';document.getElementById('pauseOverlay').style.display='none';ctx.clearRect(0,0,WIDTH,HEIGHT);if(lastRaceCount>0&&lastRaceNames.length>0){document.getElementById('playerCount').value=lastRaceCount;document.getElementById('playerCountValue').textContent=lastRaceCount;document.getElementById('raceTime').value=lastRaceTime;document.getElementById('raceTimeValue').textContent=lastRaceTime;document.getElementById('gameSpeed').value=lastGameSpeed;document.getElementById('gameSpeedValue').textContent=lastGameSpeed;document.getElementById('eventFrequency').value=lastEventFreq;document.getElementById('eventFrequencyValue').textContent=lastEventFreq;raceTime=lastRaceTime;remainingTime=lastRaceTime;gameSpeed=lastGameSpeed;eventFrequency=lastEventFreq;generatePlayerNameInputs();for(let i=0;i<lastRaceNames.length&&i<lastRaceCount;i++){const input=document.getElementById(`playerName${i}`);if(input)input.value=lastRaceNames[i]}}else{document.getElementById('playerCount').value=6;document.getElementById('playerCountValue').textContent='6';document.getElementById('raceTime').value=90;document.getElementById('raceTimeValue').textContent='90';document.getElementById('gameSpeed').value=1;document.getElementById('gameSpeedValue').textContent='1';document.getElementById('eventFrequency').value=3;document.getElementById('eventFrequencyValue').textContent='3';raceTime=90;remainingTime=90;gameSpeed=1;eventFrequency=3;generatePlayerNameInputs()}showSaveIndicator();document.getElementById('setupScreen').style.display='flex'}
function togglePause(){if(!gameRunning)return;gamePaused=!gamePaused;const btn=document.getElementById('pauseBtn');const overlay=document.getElementById('pauseOverlay');if(gamePaused){btn.textContent='▶️ 재개';btn.classList.add('resumed');overlay.style.display='flex';AudioEngine.stopBGM()}else{btn.textContent='⏸️ 일시정지';btn.classList.remove('resumed');overlay.style.display='none';if(AudioEngine.isBGMEnabled()) AudioEngine.startBGM()}}
function initEventListeners(){document.getElementById('playerCount').addEventListener('input',e=>{document.getElementById('playerCountValue').textContent=e.target.value;generatePlayerNameInputs()});document.getElementById('raceTime').addEventListener('input',e=>{document.getElementById('raceTimeValue').textContent=e.target.value});document.getElementById('gameSpeed').addEventListener('input',e=>{document.getElementById('gameSpeedValue').textContent=e.target.value});document.getElementById('eventFrequency').addEventListener('input',e=>{document.getElementById('eventFrequencyValue').textContent=e.target.value});document.getElementById('startBtn').addEventListener('click',startGame);document.getElementById('restartBtn').addEventListener('click',resetGame);document.getElementById('resetBtn').addEventListener('click',()=>{generatePlayerNameInputs()});document.getElementById('pauseBtn').addEventListener('click',togglePause);document.getElementById('exitBtn').addEventListener('click',()=>{if(confirm('경주를 종료하시겠습니까?'))exitGame()});document.getElementById('playerNameInputs').addEventListener('click',e=>{const btn=e.target.closest('.btn-remove-player');if(btn)removePlayerAt(parseInt(btn.dataset.index))});document.getElementById('playerNamesSection').addEventListener('click',e=>{if(e.target.id==='addPlayerBtn')addPlayer()});document.getElementById('saveNamesBtn').addEventListener('click',openSaveModal);document.getElementById('loadNamesBtn').addEventListener('click',quickLoad);document.getElementById('viewListsBtn').addEventListener('click',openListModal);document.getElementById('confirmSaveBtn').addEventListener('click',confirmSave);document.getElementById('saveModalCloseBtn').addEventListener('click',closeSaveModal);document.getElementById('listModalCloseBtn').addEventListener('click',closeListModal);document.getElementById('saveModal').addEventListener('click',e=>{if(e.target.id==='saveModal')closeSaveModal()});document.getElementById('listModal').addEventListener('click',e=>{if(e.target.id==='listModal')closeListModal()});document.getElementById('savedListsContainer').addEventListener('click',e=>{const btn=e.target.closest('.list-item-btn');if(!btn)return;const action=btn.dataset.action,index=parseInt(btn.dataset.index);if(action==='load')loadList(index);else if(action==='delete')deleteList(index)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSaveModal();closeListModal()}});window.addEventListener('resize',()=>{if(gameRunning){WIDTH=window.innerWidth;HEIGHT=window.innerHeight;canvas.width=WIDTH;canvas.height=HEIGHT}})}
