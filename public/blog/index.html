    <!-- Resolve lang BEFORE any UI text touches the DOM. The homepage saves
         the user's language pick into localStorage('luckyplz_lang'); URL
         ?lang= overrides for direct links. Result is exposed as window.LP_LANG
         and used by every static-text swap below + the SpaceX spotlight. -->
    <script>
    window.LP_LANG = (function() {
      /* Tier A languages (mandatory): ko, en, ja, zh. Resolve in this order:
         ?lang= query > localStorage > 'ko' default. Saves the pick back
         to localStorage so subsequent visits remember it. */
      try {
        var url = new URLSearchParams(location.search).get('lang');
        if (url) {
          var u = url.toLowerCase();
          if (u === 'en' || u.indexOf('en') === 0) {
            try { localStorage.setItem('luckyplz_lang', 'en'); } catch(e) {}
            return 'en';
          }
          if (u === 'ko' || u.indexOf('ko') === 0) {
            try { localStorage.setItem('luckyplz_lang', 'ko'); } catch(e) {}
            return 'ko';
          }
          if (u === 'ja' || u.indexOf('ja') === 0) {
            try { localStorage.setItem('luckyplz_lang', 'ja'); } catch(e) {}
            return 'ja';
          }
          if (u === 'zh' || u.indexOf('zh') === 0) {
            try { localStorage.setItem('luckyplz_lang', 'zh'); } catch(e) {}
            return 'zh';
          }
          /* any other explicit pick (es, etc.): remember the choice but render
             English — blog content isn't authored in those languages yet. */
          try { localStorage.setItem('luckyplz_lang', u); } catch(e) {}
          return 'en';
        }
        var stored = (localStorage.getItem('luckyplz_lang') || '').toLowerCase();
        if (stored === 'en' || stored.indexOf('en') === 0) return 'en';
        if (stored === 'ko' || stored.indexOf('ko') === 0) return 'ko';
        if (stored === 'ja' || stored.indexOf('ja') === 0) return 'ja';
        if (stored === 'zh' || stored.indexOf('zh') === 0) return 'zh';
        if (stored) return 'en';  /* es / other stored pick -> English fallback */
      } catch(e) {}
      return 'ko';
    })();
    if (window.LP_LANG && window.LP_LANG !== 'ko') {
      document.documentElement.setAttribute('lang', window.LP_LANG);
    }
    </script>

*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#FF6B35;--secondary:#00D9FF;--accent:#FFE66D;--danger:#FF3366;--success:#00FF88;--dark:#0A0A1A}

/* === Address-bar handling: a year-long battle, retired ===================
   Four PRs (#107 nudge, #108 lock, #109 nudge+lock, #110 visualViewport)
   tried to suppress the brief "fullscreen flash → bar re-expands" that
   iOS/Android show during page navigation. None worked: the flash is
   the BROWSER's own transition animation between document loads, not
   something the new page's JS can control. The new page hasn't even
   parsed by the time the chrome decides to re-show.

   The only reliable way to be rid of mobile chrome on this site is
   PWA standalone mode — see the install banner below + manifest.json. */
html{height:100%;height:100dvh}
body{margin:0;min-height:100vh;min-height:100dvh;font-family:var(--lb-sans);background:var(--lb-bg);color:var(--lb-ink);font-size:var(--lb-fs-body);line-height:var(--lb-lh-body);word-break:keep-all;overflow-wrap:anywhere;overflow-x:hidden;letter-spacing:.003em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}

/* 라이트 종이 배경 — 미묘한 종이 결만. (게임 홈의 별·우주 그라데이션은 제거) */
#dynamicBg{position:fixed;inset:0;z-index:-1;background:var(--lb-bg)}
.stars,.star{display:none}

/* Wrap top padding includes safe-area-inset-top so on devices with a
   notch/Dynamic Island the title clears the cutout. Bottom adds
   safe-area-inset-bottom for the iOS home indicator. The 14/60 base
   values are the visible whitespace beyond the system chrome. */
.wrap{max-width:780px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 20px calc(60px + env(safe-area-inset-bottom,0px));position:relative;z-index:1}

/* Floating home button — same muted-glass style used across every game
   page (see /games/roulette/, /games/dice/, etc.). Replaces the older
   wide top-nav to free up vertical space and stay consistent.
   `env(safe-area-inset-*)` slots the button below the iOS notch/Dynamic
   Island and to the right of the rounded screen corner so it never
   collides with system chrome on devices with cutouts. */
.floating-home{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:calc(12px + env(safe-area-inset-left,0px));z-index:1000;padding:7px 11px;border-radius:10px;background:var(--lb-surface);border:1px solid var(--lb-line);color:var(--lb-ink-soft);font-size:.78em;font-weight:500;font-family:var(--lb-sans);text-decoration:none;letter-spacing:.02em;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:background .2s,border-color .2s,color .2s;width:auto;height:auto;display:inline-block;line-height:1.2;box-shadow:0 2px 8px rgba(40,40,30,.08)}
.floating-home:hover{background:var(--lb-surface-2);border-color:var(--lb-line-strong);color:var(--lb-accent);transform:none}

/* Header margin tightened end-to-end (was 36/24). The H1 is centered so
   it never collides with the floating-home button on the left — we can
   pull it as high as visual breathing room allows. The 22px top is what
   keeps "Lucky Blog" from feeling crammed against the status bar. */
.header{text-align:center;margin-bottom:14px;margin-top:22px}
/* Title typography rebuilt for trust.

   Old version was Orbitron (sci-fi geometric) on a yellow→orange→pink
   gradient — fine for a games site but reads as "entertainment brand"
   when the reader has come for finance/AI/tech analysis. Bloomberg,
   FT, Stripe, and Linear all converged on the same template for serious
   product wordmarks: a tight humanist sans (Inter family / Pretendard
   for KR-Latin parity), generous weight (800), tight tracking
   (-0.028em — modern serious headline), and a vertical silver gradient
   that reads "metallic, considered" without going chrome-shiny.

   The 180° gradient (top white → bottom slate-blue-grey) gives a hint
   of depth that pure flat white misses, but every colour stop sits in
   the cool slate family so the wordmark feels adjacent to data viz,
   not adjacent to a casino. */
/* 메탈릭 골드 타이틀 — 중후한 금색 그라데이션 + 가운데 광택 반사 라인 +
   미세한 입체 그림자(emboss). Bungee 블록체에 금속 질감을 입힌다. */
/* 메탈릭 골드 타이틀 — 풍부한 금 그라데이션 + 두꺼운 어두운 외곽(베벨) +
   다층 입체 그림자 + 코너 스파클. 라이트 종이 위에서 또렷하게 빛난다. */
.header h1{font-family:'Bungee','Orbitron','Noto Sans KR',sans-serif;font-size:2.05em;font-weight:400;letter-spacing:.04em;line-height:1.16;margin-bottom:10px;position:relative;display:inline-block;
  background:linear-gradient(180deg,#fff4bf 0%,#ffdc54 20%,#f4a900 46%,#ffd23f 56%,#cf8a00 80%,#ffe88c 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
  -webkit-text-stroke:1.4px #6b4a0d;
  filter:drop-shadow(0 1px 0 #fff4c4) drop-shadow(0 2px 1px rgba(70,46,6,.55)) drop-shadow(0 4px 4px rgba(40,26,2,.30))}
.header h1::before,.header h1::after{content:"✦";position:absolute;color:#fff;-webkit-text-fill-color:#fff;-webkit-text-stroke:0;filter:drop-shadow(0 0 4px #fff7c8);pointer-events:none}
.header h1::before{top:-3px;left:5%;font-size:.32em}
.header h1::after{bottom:4px;right:14%;font-size:.24em}
.header p{font-size:.92em;color:var(--lb-ink-dim);line-height:1.55;font-family:var(--lb-sans);letter-spacing:-.005em}

/* Category grid — mobile-first, premium edition.
   Pixel-locked sizing (fixed `height`, absolute-px inner elements) so
   every cell is identical regardless of label length. Glass-morphism
   gradients + inset highlight + soft outer shadow give the iOS-18 /
   Material-You polish without going overboard. Spring-curve easing
   (cubic-bezier .4 0 .2 1) on every transition for that "alive" feel
   premium product apps share. */
/* 3-column grid on mobile.

   History: 7 categories used to render in a 4-col grid (PR #101), then
   we hid `build` (zero posts) so 6 categories were left. A 6-cell pool
   in a 4-col grid leaves an awkward 2-empty-slot trailing row. 3
   columns gives exactly two clean rows (3 + 3), each cell ~30% wider so
   labels read sharper and the dead zone is gone. JS in renderTabs()
   filters out any category with zero posts (except "all") so we never
   reach a short row again. */
.cat-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 24px;padding:0;font-family:'Noto Sans KR',sans-serif}
.cat-tab{box-sizing:border-box;width:100%;height:78px;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0 6px;border-radius:14px;background:var(--lb-surface);border:1px solid var(--lb-line);box-shadow:0 1px 3px rgba(40,40,30,.05);color:var(--lb-ink-soft);cursor:pointer;text-align:center;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .2s cubic-bezier(.4,0,.2,1),background .25s cubic-bezier(.4,0,.2,1),border-color .25s cubic-bezier(.4,0,.2,1),color .25s cubic-bezier(.4,0,.2,1),box-shadow .3s cubic-bezier(.4,0,.2,1)}
.cat-tab:hover{background:var(--lb-surface-2);border-color:var(--lb-line-strong);color:var(--lb-ink);transform:translateY(-1px);box-shadow:0 4px 14px rgba(40,40,30,.1)}
.cat-tab:active{transform:scale(.97);transition-duration:.1s}
.cat-tab.active{background:var(--lb-accent-soft);border-color:var(--lb-accent);color:var(--lb-accent-ink);font-weight:500;box-shadow:0 4px 14px rgba(26,110,85,.14)}
.cat-tab.empty{opacity:.42}
.cat-tab.empty:hover{opacity:.7;transform:none}
/* Wider cells in 3-col layout = bumped emoji + label sizes for sharper read. */
.cat-tab .cat-emoji{font-size:22px;line-height:1;height:24px;display:flex;align-items:center;justify-content:center;filter:saturate(1.1)}
.cat-tab .cat-label{font-size:11.5px;line-height:1.15;font-weight:600;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block;font-feature-settings:'palt'}
.cat-tab .cat-count{font-family:'JetBrains Mono','Orbitron',monospace;font-size:9.5px;font-weight:700;opacity:.5;letter-spacing:.05em;line-height:1;height:11px;display:flex;align-items:center}
.cat-tab.active .cat-count{opacity:1}
.cat-tab.active .cat-emoji{filter:saturate(1.2)}
/* Tablet+ : single-row layout. We use grid-auto-flow:column with auto
   tracks so the row width auto-fits whatever number of non-empty
   categories renders (currently 6 — was 7 before `build` got filtered).
   No hardcoded count to drift out of sync. */
@media(min-width:600px){.cat-tabs{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px;margin-bottom:34px}.cat-tab{height:96px;padding:0;border-radius:16px;gap:5px}.cat-tab .cat-emoji{font-size:24px;height:26px}.cat-tab .cat-label{font-size:12.5px;letter-spacing:.005em}.cat-tab .cat-count{font-size:11px;height:12px}}
@media(min-width:1024px){.cat-tabs{gap:12px}.cat-tab .cat-emoji{font-size:26px;height:28px}.cat-tab .cat-label{font-size:13px}}

/* === FEATURED HERO ========================================================
   Sits above the category tabs as the first content block a visitor sees
   after the hero spotlight. Auto-populated by JS with the most-recent
   post that isn't the spotlight target (so SpaceX-IPO doesn't repeat the
   same link twice when it's both promo + latest). The 4px left stripe
   echoes .post-card's 3px stripe so the visual language stays consistent
   — same vocabulary, just larger and more prominent for the headline
   item. */
.blog-featured{display:block;margin:0 auto 18px;max-width:640px;padding:18px 18px 18px 22px;background:var(--lb-surface);border:1px solid var(--lb-line);border-radius:14px;text-decoration:none;color:inherit;position:relative;overflow:hidden;transition:transform .25s,border-color .3s,background .3s,box-shadow .3s}
.blog-featured:hover{transform:translateY(-2px);border-color:var(--lb-line-strong);background:var(--lb-surface);box-shadow:0 12px 30px -12px rgba(40,40,30,.22)}
.blog-featured[hidden]{display:none!important}
.blog-featured::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--lb-line-strong);transition:background .3s}

.blog-featured.cat-probability::before{background:var(--cat-space-tech)}
.blog-featured.cat-tech-space::before{background:var(--cat-space-tech)}
/* Tag row — category badge + date/read time. Mono uppercase for that
   data-driven publication feel (Bloomberg headers use the same pattern). */
.blog-featured .bf-tag-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:700;line-height:1;flex-wrap:wrap}
.blog-featured .bf-tag{padding:3px 8px;border-radius:3px;border:1px solid currentColor}

.blog-featured.cat-baseball .bf-tag{color:var(--cat-baseball);background:var(--cat-baseball-soft);border-color:var(--cat-baseball-line)}
.blog-featured.cat-worldcup .bf-tag{color:#1f8a72;background:#e3f3ef;border-color:#c2e3da}
.blog-featured.cat-gaming-history .bf-tag{color:var(--cat-gaming-history);background:var(--cat-gaming-history-soft);border-color:var(--cat-gaming-history-line)}
.blog-featured.cat-lifestyle .bf-tag{color:var(--cat-gaming-history);background:var(--cat-gaming-history-soft);border-color:var(--cat-gaming-history-line)}

/* NEW pulse — only when today's date matches post.date. */
.blog-featured.is-new .bf-tag::after{content:' · NEW';color:#ff6b8a;animation:bfNewPulse 1.6s cubic-bezier(.4,0,.2,1) infinite}
@keyframes bfNewPulse{0%,100%{opacity:.78}50%{opacity:1}}

.blog-featured .bf-title{font-family:var(--lb-serif);font-size:1.34em;font-weight:700;color:var(--lb-ink);letter-spacing:-.015em;line-height:1.32;margin-bottom:8px}

    <script>
function createStars(){const c=document.getElementById('starsContainer');for(let i=0;i<50;i++){const s=document.createElement('div');s.className='star';const z=Math.random()*2+.5;s.style.cssText=`width:${z}px;height:${z}px;top:${Math.random()*100}%;left:${Math.random()*100}%;--dur:${Math.random()*3+2}s;animation-delay:${Math.random()*3}s`;c.appendChild(s)}}

function pick(obj, lang){
    if (obj == null) return '';
    if (typeof obj === 'string') return obj;
    return obj[lang] || obj.en || obj.ko || Object.values(obj)[0] || '';
}

function escapeHtml(s){return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function formatDate(dateStr, lang){
    try{
        const d = new Date(dateStr);
        const localeMap={en:'en-US',gb:'en-GB',ko:'ko-KR',ja:'ja-JP',zh:'zh-CN',es:'es-ES',de:'de-DE',fr:'fr-FR',pt:'pt-BR',ru:'ru-RU',ar:'ar-SA',hi:'hi-IN',th:'th-TH',id:'id-ID',vi:'vi-VN',tr:'tr-TR'};
        return d.toLocaleDateString(localeMap[lang]||'en-US',{year:'numeric',month:'short',day:'numeric'});
    }catch(e){return dateStr}
}

/* Read ?cat= query param, default to 'all'. Validates against BLOG_CATEGORIES
   so a stale or hand-typed slug falls back to 'all' instead of showing zero
   posts with no obvious recovery path. */
function getCurrentCat(){
    const url = new URL(location.href);
    const cat = (url.searchParams.get('cat') || 'all').toLowerCase();
    const valid = (window.BLOG_CATEGORIES || []).map(c => c.slug);
    return valid.includes(cat) ? cat : 'all';
}

function setCurrentCat(cat){
    const url = new URL(location.href);
    if (cat === 'all') url.searchParams.delete('cat');
    else url.searchParams.set('cat', cat);
    /* pushState so back button cycles through categories naturally. */
    history.pushState({cat}, '', url.toString());
    renderAll();
}

/* Look up category metadata for a post-card chip (small label visible
   only on the "All" tab — when the user has already filtered to a single
   category, the chip would be redundant clutter). */
function catMetaFor(slug){
    return (window.BLOG_CATEGORIES || []).find(c => c.slug === slug);
}
/* 4-lang category label with en fallback for any missing locale. */
function catLabelFor(c, bucket){
    if (!c) return '';
    return (bucket === 'ko' ? c.label_ko
          : bucket === 'ja' ? c.label_ja
          : bucket === 'zh' ? c.label_zh
          : c.label_en) || c.label_en;
}

function renderTabs(bucket, posts){
    const allCats = window.BLOG_CATEGORIES || [];
    const cur = getCurrentCat();
    const nav = document.getElementById('catTabs');
    if (!nav) return;
    /* Per-category counts against the language-filtered pool — a Korean
       visitor seeing "Lifestyle (5)" should see five Korean posts in that
       tab, not five total across all languages. */
    /* Pre-compute counts so we can both filter zero-post categories AND
       render the (n) badges without recomputing. */
    const withCount = allCats.map(c => ({
        c,
        count: c.slug === 'all'
            ? posts.length
            : posts.filter(p => (p.category||'lifestyle') === c.slug).length,
    }));
    /* Hide zero-post categories. "All" is always kept (the index page would
       have no fallback otherwise). Used to dim them with .empty class
       instead — but on mobile that left an awkward trailing-row dead cell
       (e.g. `build` floating alone in row 2). Filtering them out lets the
       3-col grid land on a clean 3+3 layout. Categories return automatically
       once a post lands in them. */
    const visible = withCount.filter(x => x.c.slug === 'all' || x.count > 0);
    nav.innerHTML = visible.map(({c, count}) => {
        const cls = ['cat-tab'];
        if (c.slug === cur) cls.push('active');
        const lbl = catLabelFor(c, bucket);
        return `<button type="button" class="${cls.join(' ')}" data-cat="${c.slug}" aria-label="${escapeHtml(lbl)} (${count})">
            <span class="cat-emoji" aria-hidden="true">${c.emoji}</span>
            <span class="cat-label">${escapeHtml(lbl)}</span>
            <span class="cat-count">${count}</span>
        </button>`;
    }).join('');
    nav.querySelectorAll('.cat-tab').forEach(btn => {
        btn.addEventListener('click', () => setCurrentCat(btn.dataset.cat));
    });
}

function renderPosts(bucket, langPosts){
    const list = document.getElementById('postsList');
    const cur = getCurrentCat();
    /* Language filter happens upstream (langPosts). Here we only further
       filter by category if the user picked a non-"all" tab. */
    const filtered = cur === 'all'
        ? langPosts
        : langPosts.filter(p => (p.category||'lifestyle') === cur);

    if (!filtered.length){
        if (cur !== 'all'){
            /* Empty category: don't push the user to switch languages —
               just nudge them back to "All" where every post lives. */
            const msg = bucket === 'ko' ? '이 카테고리는 곧 채워집니다 ✨'

                      : bucket === 'zh' ? '此分类即将更新 ✨'
                      : 'Posts coming soon ✨';
            const cta = bucket === 'ko' ? '전체 글 보기 →'
                      : bucket === 'ja' ? '全記事を見る →'
                      : bucket === 'zh' ? '查看全部文章 →'
                      : 'Browse all →';
            list.innerHTML = `<div class="empty">${msg}<br><a class="empty-cta" href="#" data-reset-cat>${cta}</a></div>`;
            const resetLink = list.querySelector('[data-reset-cat]');
            if (resetLink) resetLink.addEventListener('click', e => { e.preventDefault(); setCurrentCat('all'); });
            return;
        }
        /* When this language has no posts yet, point users to the
           most-populated alternative. ko fallback → en; everyone else
           (en/ja/zh) → ko (most populated language at present).
           Backlog #19-23 will fill in ja/zh over time. */
        const otherBucket = bucket === 'ko' ? 'en' : 'ko';
        const otherCount = (window.BLOG_POSTS||[]).filter(p => (p.lang||'ko') === otherBucket).length;
        const msgs = bucket === 'ko'
            ? {none:'한국어 글을 준비 중입니다 ✨', cta:`영어 글 ${otherCount}편 보기 →`}
          : bucket === 'ja'
            ? {none:'日本語の記事を準備中です ✨', cta:`韓国語の記事 ${otherCount}本を見る →`}
          : bucket === 'zh'
            ? {none:'中文文章筹备中 ✨', cta:`阅读 ${otherCount} 篇韩文文章 →`}
            : {none:'English posts coming soon ✨', cta:`Read ${otherCount} Korean posts →`};
        list.innerHTML = `<div class="empty">${msgs.none}${otherCount ? `<br><a class="empty-cta" href="#" data-switch-lang="${otherBucket}">${msgs.cta}</a>` : ''}</div>`;
        const switchLink = list.querySelector('[data-switch-lang]');
        if (switchLink) switchLink.addEventListener('click', e => {
            e.preventDefault();
            localStorage.setItem('luckyplz_lang', otherBucket);
            /* Keep the unified state consistent — header/spotlight/footer
               swap reads window.LP_LANG, so a soft re-render would otherwise
               see new posts but stale chrome text. Hard reload is simpler
               and matches what the homepage's language buttons do. */
            location.reload();
        });
        return;
    }

    /* Cards: per-post-card category color strip + uppercase category badge.
       Replaced cover-emoji (which felt childish for tech/economic content)
       with a typographic badge — Bloomberg/FT style. */
    list.innerHTML = filtered.map(p => {
        const title = pick(p.title, bucket);
        const excerpt = pick(p.excerpt, bucket);
        const tags = pick(p.tags, bucket) || [];
        const dateText = p.date ? formatDate(p.date, bucket) : '';
        const readText = p.readMinutes ? `· ${p.readMinutes} min` : '';
        const catSlug = p.category || 'lifestyle';
        const catMeta = catMetaFor(catSlug);
        const catLabel = catMeta ? catLabelFor(catMeta, bucket) : catSlug;
        return `
          <a class="post-card cat-${catSlug}" href="/blog/${p.slug}/">
            <span class="post-cat-badge cat-${catSlug}">${escapeHtml(catLabel)}</span>
            <div class="post-title">${escapeHtml(title)}</div>
            <div class="post-meta">
              <span>${dateText}</span>
              <span>${readText}</span>
            </div>
            <div class="post-excerpt">${escapeHtml(excerpt)}</div>
            ${Array.isArray(tags) && tags.length ? `<div class="post-tags">${tags.map(t => `<span class="post-tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
          </a>
        `;
    }).join('');
}

function renderAll(){
    /* Use the unified LP_LANG resolved in <head>. Falls back to localStorage
       so even if some entry path skips the head script (it shouldn't, but
       defensive) we still pick the saved preference. */
    const rawLang = (window.LP_LANG || localStorage.getItem('luckyplz_lang') || 'ko').toLowerCase();
    /* Posts are authored natively per-language. Site policy (CLAUDE.md
       "Blog content language tiers"): ko/ja/zh users see posts in their
       own language; everyone else falls through to en. Tier A languages
       (ko, en, ja, zh) get their own bucket; all other ?lang= values
       resolve to en. */
    const bucket = rawLang === 'ko' ? 'ko'
                 : rawLang === 'ja' ? 'ja'
                 : (rawLang === 'zh' || rawLang.startsWith('zh-')) ? 'zh'
                 : 'en';

    if (!window.BLOG_POSTS || !BLOG_POSTS.length){
        const emptyMsg = bucket === 'ko' ? '첫 글을 준비 중입니다 ✨'
                       : bucket === 'ja' ? '最初の記事を準備中です ✨'
                       : bucket === 'zh' ? '即将发布首篇文章 ✨'
                       : 'First post coming soon ✨';
        document.getElementById('postsList').innerHTML = `<div class="empty">${emptyMsg}</div>`;
        return;
    }
    /* Hide auto-generated daily market posts (open/close-brief, premarket,
       tech-recap) from the browse list, tab counts, and the featured hero.
       They are thin/ephemeral, already noindexed + robots-disallowed, and
       AdSense flagged the daily flood as "low value content". Keeping the
       index curated to the hand-written longform + game-tool posts presents
       the blog by its real value. Daily posts stay reachable by direct link
       (the auto-publish notification / shares); they're just not featured. */
    const DAILY_AUTO_RE = /(^|-)(tech-recap|recap|open-brief|close-brief|premarket|baseball-daily|football-daily|worldcup-daily)-\d{4}-\d{2}-\d{2}/;
    const allPosts = [...BLOG_POSTS]
        .filter(p => !DAILY_AUTO_RE.test(p.slug || ''))
        .sort((a,b) => (b.date||'').localeCompare(a.date||''));
    const langPosts = allPosts.filter(p => (p.lang||'ko') === bucket);

    renderTabs(bucket, langPosts);
    renderPosts(bucket, langPosts);
    renderFeatured(bucket, langPosts);
}

/* === FEATURED HERO POPULATION ============================================
   Picks the latest post that is NOT the same target as the SpaceX
   spotlight directly above (avoids two link-buttons going to the same
   article in a single viewport). Falls back to the absolute latest if
   the first candidate is unavailable.

   The 4-step DOM update is wrapped in a try/catch so a malformed post
   entry can't kill the whole page. */
function renderFeatured(bucket, langPosts){
    const featured = document.getElementById('blogFeatured');
    if (!featured || !langPosts || !langPosts.length) return;

    const spotlight = document.getElementById('spacexSpotlight');
    const spotlightHref = spotlight ? spotlight.getAttribute('href') : '';

    /* Sort is already done upstream (renderAll passes pre-sorted langPosts).
       Pick the first non-spotlight post; if everything is the spotlight
       target, just use the latest. */
    let pick = langPosts.find(p => '/blog/' + p.slug + '/' !== spotlightHref);
    if (!pick) pick = langPosts[0];
    if (!pick) return;

    /* Reset any prior category class — the user might have flipped lang
       and the previously-featured post had a different category. */
    featured.className = 'blog-featured cat-' + (pick.category || 'lifestyle');

    const cats = window.BLOG_CATEGORIES || [];
    const catMeta = cats.find(c => c.slug === pick.category);
    const catLabel = catMeta
        ? catLabelFor(catMeta, bucket)
        : (pick.category || '');

    const today = new Date().toLocaleDateString('en-CA');
    if (pick.date === today) featured.classList.add('is-new');

    /* Format date in user-locale; reuse the existing helper so KR/EN
       get appropriate formats. */
    const dateText = pick.date ? formatDate(pick.date, bucket) : '';
    const readText = pick.readMinutes
        ? (bucket === 'ko' ? `${pick.readMinutes}분 읽기`
         : bucket === 'ja' ? `${pick.readMinutes}分で読む`
         : bucket === 'zh' ? `${pick.readMinutes} 分钟阅读`
         : `${pick.readMinutes} MIN`)
        : '';
    const metaText = [dateText.toUpperCase(), readText].filter(Boolean).join(' · ');

    const setText = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text || ''; };
    setText('bfTag', catLabel.toUpperCase());
    setText('bfMeta', metaText);
    setText('bfTitle', pick.title || '');
    setText('bfExcerpt', pick.excerpt || '');
    setText('bfCtaText', bucket === 'ko' ? '자세히 읽기'
                       : bucket === 'ja' ? '続きを読む'
                       : bucket === 'zh' ? '阅读全文'
                       : 'Read more');

    featured.href = '/blog/' + pick.slug + '/';
    featured.hidden = false;
}

/* Browser back/forward should cycle through category tabs without a
   full reload — popstate fires when the user navigates the URL stack. */
window.addEventListener('popstate', renderAll);

createStars();
renderAll();

/* === PWA install banner — see CSS + HTML markup above. ====================
   Browser regulations make a regular-visit fullscreen impossible. The
   only standards-compliant route is `display: standalone` on a homescreen
   install. This banner offers that — quietly. Branching:

   - iOS Safari: no install API, so we explain the manual steps (Share →
     Add to Home Screen). One tap dismisses the banner.
   - Chrome / Edge / Samsung Internet: BeforeInstallPromptEvent fires
     before paint; we capture it and call .prompt() on user click.
   - Already-installed (display-mode: standalone, or navigator.standalone):
     skip entirely — they're already in the fullscreen experience.
   - Recently dismissed: 14-day cooldown via localStorage so we don't
     pester the same visitor every page load. */
(function(){
  if (typeof window === 'undefined' || !document) return;

  /* === Skip if running standalone (banner is for non-installed users) === */
  var inStandalone =
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
    window.navigator.standalone === true;
  if (inStandalone) return;

  /* === Mobile only — desktop has no notion of "add to home screen" === */
  if (!window.matchMedia || !window.matchMedia('(max-width: 900px)').matches) return;

  /* === 14-day cooldown after dismiss === */
  var DISMISS_KEY = 'lp_install_dismissed';
  var COOLDOWN_MS = 14 * 24 * 60 * 60 * 1000;
  try {
    var ts = parseInt(localStorage.getItem(DISMISS_KEY) || '0', 10);
    if (ts && (Date.now() - ts) < COOLDOWN_MS) return;
  } catch(e) {}

  var banner = document.getElementById('lpInstallBanner');
  var titleEl = document.getElementById('lpInstallTitle');
  var descEl = document.getElementById('lpInstallDesc');
  var actionEl = document.getElementById('lpInstallAction');
  var closeEl = document.getElementById('lpInstallClose');
  if (!banner || !titleEl || !descEl || !actionEl || !closeEl) return;

  var ua = navigator.userAgent || '';
  var isIOS = /iP(hone|ad|od)/.test(ua) && !window.MSStream;
  var isEN = (window.LP_LANG === 'en');

  /* === Copy table — kept terse and unsalesy. The Korean is 존댓말 but
        avoids exclamation marks and hype words. Mark glyph (⌂) carries
        the icon load instead of an emoji. */
  var copy = isEN ? {
    title: 'View in fullscreen',
    desc_install: 'Add to Home Screen for a chrome-free reading experience.',
    desc_ios: 'Tap Share → "Add to Home Screen" for chrome-free reading.',
    desc_other: 'Open browser menu → "Add to Home Screen".',
    action_install: 'Install',
    action_ok: 'Got it',
  } : {
    title: '전체 화면으로 보기',
    desc_install: '홈 화면에 추가하면 주소창 없이 깔끔하게 읽을 수 있어요.',
    desc_ios: '공유 버튼 → "홈 화면에 추가" 를 누르면 주소창 없이 사용할 수 있어요.',
    desc_other: '브라우저 메뉴 → "홈 화면에 추가" 를 선택하세요.',
    action_install: '추가',
    action_ok: '확인',
  };

  titleEl.textContent = copy.title;

  /* === Captured BeforeInstallPromptEvent (Chromium browsers) === */
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    /* Don't let the browser show its own mini-prompt — we'll fire
       it ourselves when the user taps the action button. */
    e.preventDefault();
    deferredPrompt = e;
    /* If banner is already showing with the "no API available" copy,
       upgrade it to the install-button flow. */
    if (banner.classList.contains('show')) wireForInstall();
  });

  function dismiss(){
    banner.classList.remove('show');
    banner.setAttribute('aria-hidden', 'true');
    try { localStorage.setItem(DISMISS_KEY, String(Date.now())); } catch(e) {}
  }

  function wireForInstall(){
    descEl.textContent = copy.desc_install;
    actionEl.textContent = copy.action_install;
    actionEl.onclick = function(){
      if (!deferredPrompt) {
        descEl.textContent = copy.desc_other;
        actionEl.textContent = copy.action_ok;
        actionEl.onclick = dismiss;
        return;
      }
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(){
        deferredPrompt = null;
        dismiss();
      });
    };
  }

  function wireForIOS(){
    /* iOS has no install API. The action button just acknowledges the
       instructions. Step-by-step copy is in the description. */
    descEl.textContent = copy.desc_ios;
    actionEl.textContent = copy.action_ok;
    actionEl.onclick = dismiss;
  }

  if (isIOS) {
    wireForIOS();
  } else {
    wireForInstall();
  }
  closeEl.onclick = dismiss;

  /* === Show after a 4s breath so the page paints + the user sees a
        working blog index *first*. The banner reads as a quiet
        suggestion, not an interstitial. */
  setTimeout(function(){
    banner.classList.add('show');
    banner.setAttribute('aria-hidden', 'false');
  }, 4000);
})();
    </script>
<script>/* Nuke any legacy service worker + its caches on every page load.
   See public/sw.js comments. Safe to remove once server logs show
   no one hits /sw.js anymore. */
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(s=>s.unregister())).catch(()=>{})}
if('caches' in window){caches.keys().then(k=>k.forEach(n=>caches.delete(n))).catch(()=>{})}</script>
