*{margin:0;padding:0;box-sizing:border-box}
[hidden]{display:none!important}
:root{--primary:#FF6B35;--secondary:#00D9FF;--accent:#FFE66D;--accent-warm:#FF9A3C;--danger:#FF3366;--success:#00FF88;--dark:#0A0A1A;--muted:rgba(255,255,255,.55);--muted-2:rgba(255,255,255,.35);--muted-3:rgba(255,255,255,.18)}
/* flex-direction:column because siteFooter.js injects a .lp-site-footer
   element at the end of <body>; with the default flex-direction:row that
   footer becomes a flex SIBLING of .auth-card and crushes the card's
   width to ~46px on mobile ("card is thin and long" bug). Stacking
   vertically keeps the card centered and lets the footer land below it.
   The ad <ins>, dynamic BG, and starfield are position:fixed/absolute so
   they don't participate in flex layout. */
body{font-family:'Noto Sans KR',sans-serif;background:var(--dark);min-height:100vh;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;letter-spacing:.01em;gap:24px}

#dynamicBg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 50% 20%,rgba(255,230,109,.06) 0%,transparent 55%),radial-gradient(ellipse at 20% 85%,rgba(255,107,53,.04) 0%,transparent 55%),linear-gradient(180deg,#0A0A1A 0%,#10101F 50%,#0A0A1A 100%)}
.stars{position:fixed;inset:0;pointer-events:none;z-index:-1}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--dur) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.12;transform:scale(.8)}50%{opacity:.65;transform:scale(1.1)}}

.auth-card{
    background:linear-gradient(165deg,rgba(22,22,42,.72),rgba(12,12,28,.88));
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border-radius:20px;padding:38px 32px 30px;
    border:1px solid rgba(255,255,255,.06);
    box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.04);
    width:420px;max-width:94vw;text-align:center;position:relative;overflow:hidden
}
.auth-card::before{content:'';position:absolute;top:0;left:22%;right:22%;height:1px;background:linear-gradient(90deg,transparent,rgba(255,230,109,.45),transparent)}

.auth-card .logo{font-family:'Orbitron','Noto Sans KR',sans-serif;font-size:1.5em;font-weight:900;letter-spacing:.03em;background:linear-gradient(135deg,#FFE66D 0%,#FF9A3C 50%,#FF6B8B 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px;cursor:pointer;display:inline-block;transition:filter .2s}
.auth-card .logo:hover{filter:brightness(1.15)}
.auth-card .subtitle{font-size:.82em;color:var(--muted-2);margin-bottom:26px;letter-spacing:.02em;line-height:1.5}

/* Social OAuth */
.oauth-row{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:12px 16px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:#fff;font-size:.9em;font-weight:600;cursor:pointer;transition:border-color .2s,background .2s,transform .15s;font-family:'Noto Sans KR',sans-serif;letter-spacing:.01em}
.oauth-btn:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.07);transform:translateY(-1px)}
.oauth-btn:active{transform:translateY(0)}
.oauth-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.oauth-btn .oauth-ico{width:18px;height:18px;flex-shrink:0}
/* Kakao brand button — #FEE500 fill, black text, no border.
   Follows Kakao's official button design guide so the KR market
   immediately recognises it as the official social login path. */
.oauth-btn-kakao{background:#FEE500;color:#181600;border-color:#FEE500;font-weight:700}
.oauth-btn-kakao:hover{background:#F5D900;border-color:#F5D900;color:#000}
.oauth-btn-kakao:disabled{background:#FEE500;color:#181600;opacity:.5}
.oauth-divider{display:flex;align-items:center;gap:12px;margin:4px 0 18px;color:var(--muted-2);font-size:.7em;letter-spacing:.1em;text-transform:uppercase}
.oauth-divider::before,.oauth-divider::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.06)}

/* Tabs - underline style */
.tab-bar{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:22px;position:relative}
.tab-btn{flex:1;padding:12px 0;background:none;color:var(--muted-2);border:none;font-size:.85em;font-weight:700;cursor:pointer;transition:color .25s;font-family:'Noto Sans KR',sans-serif;letter-spacing:.04em;position:relative}
.tab-btn::after{content:'';position:absolute;left:22%;right:22%;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-warm));border-radius:1px;transform:scaleX(0);transition:transform .3s cubic-bezier(.4,0,.2,1)}
.tab-btn.active{color:#fff}
.tab-btn.active::after{transform:scaleX(1)}
.tab-btn:hover:not(.active){color:rgba(255,255,255,.7)}

/* Forms */
.form-group{margin:14px 0;text-align:left}
.form-group label{display:block;font-size:.68em;color:var(--muted-2);margin-bottom:6px;padding-left:2px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.form-group input{width:100%;padding:13px 16px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:rgba(255,255,255,.025);color:#fff;font-size:.95em;outline:none;transition:border-color .25s,background .25s;font-family:'Noto Sans KR',sans-serif}
.form-group input:focus{border-color:rgba(255,230,109,.55);background:rgba(255,255,255,.045)}
.form-group input::placeholder{color:rgba(255,255,255,.15)}

.submit-btn{width:100%;padding:14px;margin-top:20px;border:none;border-radius:12px;background:linear-gradient(135deg,#FF9A3C 0%,#FF6B35 100%);color:#fff;font-size:.9em;font-weight:800;font-family:'Orbitron','Noto Sans KR',sans-serif;letter-spacing:.12em;cursor:pointer;transition:transform .18s,box-shadow .2s,filter .2s;box-shadow:0 6px 20px rgba(255,107,53,.18)}
.submit-btn:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 10px 26px rgba(255,107,53,.28)}
.submit-btn:active{transform:translateY(0)}
.submit-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;filter:none;box-shadow:none}

.forgot-link{display:inline-block;margin-top:14px;font-size:.76em;color:var(--muted);cursor:pointer;border:none;background:none;text-decoration:none;letter-spacing:.02em;transition:color .2s}
.forgot-link:hover{color:var(--accent)}

/* Messages */
.msg{padding:10px 14px;border-radius:10px;font-size:.82em;margin:14px 0;display:none;text-align:center;border:1px solid transparent;letter-spacing:.01em}
.msg.error{display:block;background:rgba(255,51,102,.08);border-color:rgba(255,51,102,.25);color:#FF6B8B}
.msg.success{display:block;background:rgba(0,255,136,.06);border-color:rgba(0,255,136,.2);color:var(--success)}
.msg.info{display:block;background:rgba(0,217,255,.06);border-color:rgba(0,217,255,.2);color:var(--secondary)}

/* Profile view */
.profile-section{text-align:center}
.profile-avatar{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#FFE66D 0%,#FF9A3C 60%,#FF6B8B 100%);display:flex;align-items:center;justify-content:center;font-size:1.85em;font-weight:900;margin:0 auto 14px;color:#0A0A1A;font-family:'Orbitron',sans-serif;box-shadow:0 8px 24px rgba(255,154,60,.2)}
.profile-name{font-family:'Orbitron','Noto Sans KR',sans-serif;font-size:1.2em;font-weight:800;color:#fff;margin-bottom:4px;letter-spacing:.03em}
.profile-email{font-size:.82em;color:var(--muted-2);margin-bottom:14px}
.profile-badge{display:inline-block;padding:5px 12px;border-radius:999px;font-size:.7em;font-weight:700;margin-bottom:20px;letter-spacing:.05em}
.profile-badge.verified{background:rgba(0,255,136,.08);color:var(--success);border:1px solid rgba(0,255,136,.25)}
.profile-badge.unverified{background:rgba(255,230,109,.08);color:var(--accent);border:1px solid rgba(255,230,109,.25)}

.profile-actions{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.profile-btn{padding:12px;border:1px solid transparent;border-radius:12px;font-size:.85em;font-weight:700;cursor:pointer;transition:transform .18s,background .2s,color .2s,border-color .2s;font-family:'Noto Sans KR',sans-serif;letter-spacing:.02em}
.profile-btn:hover{transform:translateY(-1px)}
.profile-btn.home{background:linear-gradient(135deg,#FFE66D,#FF9A3C);color:#0A0A1A;box-shadow:0 4px 16px rgba(255,230,109,.15)}
.profile-btn.home.return{background:linear-gradient(135deg,#00FF88,#00CC6E);color:#0A0A1A;box-shadow:0 4px 16px rgba(0,255,136,.2)}
.profile-btn.logout{background:transparent;color:var(--muted);border-color:rgba(255,255,255,.08)}
.profile-btn.logout:hover{color:var(--danger);border-color:rgba(255,51,102,.3);background:rgba(255,51,102,.04)}
.profile-btn.resend{background:rgba(255,230,109,.06);color:var(--accent);border-color:rgba(255,230,109,.2)}

/* Password reset form */
.reset-section{display:none}
.back-link{font-size:.76em;color:var(--muted);cursor:pointer;border:none;background:none;margin-bottom:14px;display:inline-block;letter-spacing:.02em;transition:color .2s}
.back-link:hover{color:var(--accent)}

/* Home link */
.home-link{display:inline-block;margin-top:22px;font-size:.74em;color:var(--muted-2);text-decoration:none;transition:color .2s;letter-spacing:.02em}
.home-link:hover{color:var(--accent)}

@media(max-width:500px){
    .auth-card{padding:30px 22px 24px}
    .auth-card .logo{font-size:1.3em}
    .form-group input{padding:11px 14px;font-size:.9em}
    .submit-btn{padding:13px;font-size:.85em}
}
    </style>
</head>

let lang='en';
/* T() — looks up key in I18N first (existing 16-lang dict), then I18N_X
   (new consent/error dict). Both fall back to English. Missing keys
   return the literal key as a last resort so something visible shows. */
function T(k){
    if (I18N[lang] && I18N[lang][k] != null) return I18N[lang][k];
    if (I18N_X[lang] && I18N_X[lang][k] != null) return I18N_X[lang][k];
    if (I18N.en[k] != null) return I18N.en[k];
    if (I18N_X.en[k] != null) return I18N_X.en[k];
    return k;
}
/* Escape user-controlled text for safe innerHTML usage. The consent
   strings are dictionary literals (not user input) so XSS isn't a
   real risk here, but we still treat them defensively in case future
   keys ever surface user data. */
function _escHtml(s){
    return String(s||'').replace(/[&<>"']/g, ch => (
        {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]
    ));
}

/* ===== UI =====
   showTab / showReset / hideReset / handleReset 등 email-password
   가입 시절 함수들은 OAuth-only 전환으로 제거됨. 가입 경로는 이제
   Google · Kakao 둘 뿐이라 탭이나 비번 재설정 화면이 필요 없음. */
function showMsg(text,type='error'){
    const el=document.getElementById('msgBox');
    el.textContent=text;el.className='msg '+type;
}
function clearMsg(){
    const el=document.getElementById('msgBox');
    el.textContent='';el.className='msg';
}

const entryParams=new URLSearchParams(location.search);
let switchAccount=entryParams.get('switch')==='1';
let returnTarget=typeof safeAuthReturn==='function'
    ?safeAuthReturn(entryParams.get('return'))||safeAuthReturn(entryParams.get('next')):null;
function getReturnUrl(){return returnTarget;}
function referringPage(){
    try{
        const previous=new URL(document.referrer);
        if(previous.origin!==location.origin||/^\/auth(?:\/|$)/.test(previous.pathname))return null;
        return safeAuthReturn(previous.pathname+previous.search+previous.hash);
    }catch(_){return null;}
}

function goReturn(){
    const r=getReturnUrl();
    if(r)location.href=r;
    else location.href='/';
}

function showProfile(user){
    document.getElementById('authSection').style.display='none';
    document.getElementById('profileSection').style.display='block';

    const name=getDisplayName(user);
    document.getElementById('profileAvatar').textContent=name.charAt(0).toUpperCase();
    document.getElementById('profileName').textContent=name;
    document.getElementById('profileEmail').textContent=user.email;

    // Kakao can grant a profile without sharing an email address.
    const verified=!!(user.email&&user.email_confirmed_at);
    const hasEmailIdentity=user.identities?.some(identity=>identity.provider==='email')||user.app_metadata?.provider==='email';
    const badge=document.getElementById('profileBadge');
    badge.hidden=!user.email;
    badge.textContent=verified?'✅ '+T('verified'):'⚠️ '+T('unverified');
    badge.className='profile-badge '+(verified?'verified':'unverified');

    document.getElementById('resendBtn').style.display=user.email&&!verified&&hasEmailIdentity?'block':'none';

    const retBtn=document.getElementById('returnBtn');
    if(getReturnUrl()){
        retBtn.style.display='block';
        retBtn.textContent=T('continueBack');
    } else {
        retBtn.style.display='none';
    }
}

function showAuth(){
    document.getElementById('authSection').style.display='block';
    document.getElementById('profileSection').style.display='none';
}

function applyLanguage(){
    document.getElementById('subtitle').textContent=switchAccount?(SWITCH_TITLE[lang]||SWITCH_TITLE.en):T('subtitle');
    document.getElementById('homeLink').textContent='🏠 '+T('backToGames');
    document.getElementById('googleBtnText').textContent=T('google');
    const kk=document.getElementById('kakaoBtnText');
    if(kk)kk.textContent=T('kakao')||'Continue with Kakao';
    /* <html lang> attribute follows current language so screen readers
       and SEO crawlers see the right locale. en-GB → "en-GB", others
       → 2-letter code. */
    document.documentElement.lang = (lang==='gb'?'en-GB':lang);
    document.getElementById('profileGames').textContent='🎮 '+T('playGames');
    document.querySelector('.profile-btn.logout').textContent=T('logout');
    document.getElementById('resendBtn').textContent=T('resend');
    document.getElementById('retryAuth').textContent=flowText('retry');
    document.getElementById('browserLink').textContent=flowText('browser');
    /* 동의 미체크 안내 메시지 — i18n 'mustAgreeRequired' 재활용
       (회원가입 시 검증 메시지와 동일 의미). */
    const hint = document.getElementById('consentHint');
    if (hint) hint.textContent = T('mustAgreeRequired');

    /* ----- Consent block (signup form) — innerHTML render -----
       Templates carry {link} placeholders so each language places the
       link wherever its grammar wants (KR postfix vs EN infix). The
       link itself is hardcoded markup pointing to /privacy/. */
    const aAll=document.getElementById('caAgreeAllText');
    if(aAll){
        aAll.innerHTML = _escHtml(T('agreeAll'))
            +' <span style="color:rgba(255,255,255,.5);font-weight:500;font-size:.86em">'
            + _escHtml(T('agreeAllSub')) +'</span>';
    }
    const REQ='<span style="color:#FF9A3C;font-weight:700">['+_escHtml(T('tagRequired'))+']</span>';
    const OPT='<span style="color:rgba(255,255,255,.5);font-weight:700">['+_escHtml(T('tagOptional'))+']</span>';
    const LINK_T='<a href="/terms/" target="_blank" rel="noopener" style="color:#00D9FF;text-decoration:underline">'+_escHtml(T('linkTerms'))+'</a>';
    const LINK_P='<a href="/privacy/" target="_blank" rel="noopener" style="color:#00D9FF;text-decoration:underline">'+_escHtml(T('linkPrivacy'))+'</a>';
    const aT=document.getElementById('caTermsText');
    if(aT) aT.innerHTML = REQ+' '+ String(T('agreeTermsTpl')).replace('{link}', LINK_T);
    const aP=document.getElementById('caPrivacyText');
    if(aP) aP.innerHTML = REQ+' '+ String(T('agreePrivacyTpl')).replace('{link}', LINK_P);
    const aM=document.getElementById('caMarketingText');
    if(aM) aM.innerHTML = OPT+' '+ _escHtml(T('agreeMarketing'));
}

/* ===== Cloudflare Turnstile bot-protection =====
   OAuth-only 전환 후 Turnstile 마운트 자체가 사라짐 — Google/Kakao
   가 자체 봇 방어 (reCAPTCHA / Kakao 자체 검증) 를 갖고 있어
   Turnstile 추가는 중복. 향후 OAuth 외 경로 추가 시 재활성화 가능
   하도록 helper 만 남겨둠 (전부 no-op). */
function _captchaActive(){ return false; }

/* ===== Consent checkboxes — master ↔ children sync + OAuth gate =====
   - 전체 동의 토글 → 셋 다 체크 (네이버/카카오/토스 패턴)
   - 개별 토글 → master 자동 갱신
   - 추가: terms + privacy 둘 다 체크돼야 OAuth 버튼 활성화. 안 그러면
     KISA 정통망법 위반 (외부 서비스로 정보 전송 전 명시적 동의 필요).
     marketing 은 [선택] 이라 게이트에 안 들어감. */
const CONSENT_STORAGE_KEY = 'lp_pending_consent';
let authBusy=true;
function _refreshOauthGate(){
    const t = document.getElementById('signupTerms');
    const p = document.getElementById('signupPrivacy');
    const ok = !!(t && p && t.checked && p.checked);
    const gBtn = document.getElementById('googleBtn');
    const kBtn = document.getElementById('kakaoBtn');
    if (gBtn) gBtn.disabled = !ok||authBusy;
    if (kBtn) kBtn.disabled = !ok||authBusy;
    const hint = document.getElementById('consentHint');
    if (hint) hint.style.display = ok ? 'none' : 'block';
}
(function _wireConsentMaster(){
    const master = document.getElementById('signupAgreeAll');
    const t = document.getElementById('signupTerms');
    const p = document.getElementById('signupPrivacy');
    const m = document.getElementById('signupMarketing');
    if (!master || !t || !p || !m) return;
    master.addEventListener('change', () => {
        t.checked = master.checked;
        p.checked = master.checked;
        m.checked = master.checked;
        _refreshOauthGate();
    });
    [t, p, m].forEach(cb => {
        cb.addEventListener('change', () => {
            master.checked = t.checked && p.checked && m.checked;
            _refreshOauthGate();
        });
    });
    _refreshOauthGate();   /* 초기 상태 반영 */
})();

    tr:['Giriş yapılıyor…','Giriş iptal edildi. Tekrar deneyebilirsiniz.','Giriş yapılamadı. Lütfen tekrar deneyin.','Giriş isteğinin süresi doldu. Bu sekmede yeniden başlayın.','Tekrar dene','Google ile giriş için tarayıcıda aç']
};
function flowText(key){
    return (FLOW_TEXT[lang]||FLOW_TEXT.en)[['busy','cancel','failed','expired','retry','browser'].indexOf(key)];
}
const hasCallback=!!(authLanding.code||authLanding.error||authLanding.errorCode||authLanding.implicit);
const directKakao=!!(authLanding.state&&(authLanding.code||authLanding.error||authLanding.errorCode));
const kakaoInApp=/(iPhone|iPad|iPod|Android).*KAKAOTALK/i.test(navigator.userAgent);
const KAKAO_CLIENT_ID='847abad1c7bd5a9242197654386bdc0d';
const CALLBACK_URL=location.origin+'/auth/';

function authUrl(){
    const u=new URL(CALLBACK_URL);
    if(returnTarget)u.searchParams.set('return',returnTarget);
    if(switchAccount)u.searchParams.set('switch','1');
    u.searchParams.set('lang',lang);
    return u;
}
function openBrowserForGoogle(){
    const u=authUrl();
    const previous=!hasCallback&&!returnTarget&&referringPage();
    if(previous)u.searchParams.set('return',previous);
    return 'kakaotalk://web/openExternal?url='+encodeURIComponent(u.href);
}
function setBusy(value){
    authBusy=value;
    _refreshOauthGate();
}
function readAttempt(){
    let a;
    try{a=JSON.parse(sessionStorage.getItem(CONSENT_STORAGE_KEY));}catch(_){}
    return a&&a.terms===true&&a.privacy===true&&Number.isFinite(a.ts)&&a.ts<=Date.now()&&Date.now()-a.ts<3600000?a:null;
}
function discardAttempt(){
    try{
        for(const key of [CONSENT_STORAGE_KEY,'kakao_oauth_state','kakao_oauth_return','kakao_oauth_nonce'])sessionStorage.removeItem(key);
    }catch(_){}
}
function restoreChecks(attempt){
    if(!attempt)return;
    document.getElementById('signupTerms').checked=attempt.terms;
    document.getElementById('signupPrivacy').checked=attempt.privacy;
    document.getElementById('signupMarketing').checked=!!attempt.marketing;
    document.getElementById('signupAgreeAll').checked=!!attempt.marketing&&attempt.terms&&attempt.privacy;
}
function saveAttempt(provider,state){
    const attempt={provider,state,returnTo:returnTarget,switchAccount,lang,ts:Date.now(),
        terms:document.getElementById('signupTerms').checked,
        privacy:document.getElementById('signupPrivacy').checked,
        marketing:document.getElementById('signupMarketing').checked};
    discardAttempt();
    sessionStorage.setItem(CONSENT_STORAGE_KEY,JSON.stringify(attempt));
}
function callbackAttempt(){
    const attempt=readAttempt();
    if(!attempt||attempt.userId)return null;
    // An account chooser opened before this update stored Kakao state separately.
    if(!attempt.provider&&directKakao){
        attempt.state=sessionStorage.getItem('kakao_oauth_state');
        attempt.returnTo=sessionStorage.getItem('kakao_oauth_return');
    }
    // Some providers omit state when the user cancels. Only restore this tab's form.
    if(!authLanding.state&&(authLanding.error||authLanding.errorCode))return attempt;
    if(directKakao){
        return (!attempt.provider||attempt.provider==='kakao')&&attempt.state===authLanding.state?attempt:null;
    }
    return !attempt.provider||attempt.provider==='google'?attempt:null;
}
async function beginLogin(provider){
    if(authBusy)return;
    if(!document.getElementById('signupTerms').checked||!document.getElementById('signupPrivacy').checked){
        showMsg(T('mustAgreeRequired'));return;
    }
    if(!hasCallback&&!returnTarget)returnTarget=referringPage();
    if(provider==='google'&&kakaoInApp){location.href=openBrowserForGoogle();return;}
    clearMsg();
    document.getElementById('retryAuth').hidden=true;
    setBusy(true);
    showMsg(flowText('busy'),'info');
    try{
        if(provider==='google'){
            saveAttempt(provider,null);
            const options={redirectTo:CALLBACK_URL};
            if(switchAccount)options.queryParams={prompt:'select_account'};
            const {error}=await getSupabase().auth.signInWithOAuth({provider,options});
            if(error)throw error;
        }else{
            const state=Array.from(crypto.getRandomValues(new Uint8Array(24)),b=>b.toString(16).padStart(2,'0')).join('');
            saveAttempt(provider,state);
            const params=new URLSearchParams({client_id:KAKAO_CLIENT_ID,redirect_uri:CALLBACK_URL,
                response_type:'code',scope:'openid,profile_nickname,profile_image',state});
            if(switchAccount)params.set('prompt','select_account');
            location.assign('https://kauth.kakao.com/oauth/authorize?'+params);
        }
    }catch(_){
        discardAttempt();setBusy(false);showMsg(flowText('failed'));
    }
}
function handleGoogleLogin(){return beginLogin('google');}
function handleKakaoLogin(){return beginLogin('kakao');}

async function exchangeKakao(code){
    const r=await fetch(SUPABASE_URL+'/functions/v1/kakao-token',{
        method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({code,redirect_uri:CALLBACK_URL})
    });
    if(!r.ok)throw new Error('kakao_exchange_failed');
    const data=await r.json();
    if(!data.id_token)throw new Error('kakao_token_missing');
    const {data:result,error}=await getSupabase().auth.signInWithIdToken({provider:'kakao',token:data.id_token});
    if(error||!result.user||!result.session)throw new Error('kakao_session_failed');
    return result.user;
}
function startAnalytics(){
    if(!/(^|\.)luckyplz\.com$/.test(location.hostname))return;
    window.dataLayer=window.dataLayer||[];
    window.gtag=function(){dataLayer.push(arguments);};
    gtag('js',new Date());
    gtag('config','G-NZDPE3H3DQ',{page_location:CALLBACK_URL});
    const s=document.createElement('script');s.async=true;s.src='https://www.googletagmanager.com/gtag/js?id=G-NZDPE3H3DQ';document.head.appendChild(s);
}
function showRetry(){
    showAuth();
    showMsg(flowText('failed'));
    document.getElementById('retryAuth').hidden=false;
    setBusy(true);
}
let displayedId=null,settling=false;
async function finishSession(){
    if(settling)return;
    settling=true;
    try{
        const s=await ensureProfile({force:true,throwOnError:true});
        if(!s.signedIn){showAuth();if(hasCallback)showMsg(flowText('failed'));return;}
        if(s.needsSetup){
            const setup=new URL('/auth/setup/',location.origin);
            if(returnTarget&&!/^\/auth\/setup(?:\/|[?#]|$)/.test(returnTarget))setup.searchParams.set('next',returnTarget);
            else if(returnTarget) {location.replace(returnTarget);return;}
            location.replace(setup.href);return;
        }
        await commitAuthConsent(s.authUser.id,s.profile);
        if(returnTarget)location.replace(returnTarget);
        else{displayedId=s.authUser.id;showProfile(s.authUser);}
    }catch(_){showRetry();}
    finally{settling=false;}
}
async function handleLogout(){
    try{
        const {error}=await signOut();
        if(error)throw error;
        displayedId=null;showAuth();showMsg(T('logoutSuccess'),'info');
    }catch(_){
        const el=document.getElementById('profileMsg');el.textContent=flowText('failed');el.className='msg error';
    }
}

async function resendVerification(){
    const user=await getUser();
    if(!user)return;
    const{error}=await getSupabase().auth.resend({type:'signup',email:user.email});
    const el=document.getElementById('profileMsg');
    if(error){el.textContent=error.message;el.className='msg error'}
    else{el.textContent=T('resendSuccess');el.className='msg success'}
}

/* ===== Init ===== */
async function init(){
    let preferred=entryParams.get('lang');
    try{preferred=preferred||localStorage.getItem('luckyplz_lang');}catch(_){}
    if(preferred&&I18N[preferred])lang=preferred;
    else{
        for(const choice of navigator.languages||[navigator.language||'en']){
            const tag=choice.toLowerCase(),base=tag.split('-')[0];
            if(tag==='en-gb'){lang='gb';break;}
            if(I18N[base]){lang=base;break;}
        }
    }
    createStars();applyLanguage();
    document.getElementById('retryAuth').onclick=()=>location.reload();
    let acceptSessionEvents=false,confirmed=false;
    const browserLink=document.getElementById('browserLink');
    const refreshBrowserLink=()=>{browserLink.hidden=!kakaoInApp;browserLink.href=openBrowserForGoogle();};
    try{
        if(hasCallback)showMsg(flowText('busy'),'info');
        const attempt=hasCallback?callbackAttempt():null;
        if(attempt){
            returnTarget=returnTarget||safeAuthReturn(attempt.returnTo);
            switchAccount=switchAccount||attempt.switchAccount===true;
            if(attempt.lang&&I18N[attempt.lang]){lang=attempt.lang;applyLanguage();}
        }
        if(directKakao)history.replaceState(null,'',authUrl().href);
        const client=getSupabase();
        const initialized=await client.auth.initialize();
        if(authLanding.error||authLanding.errorCode){
            const cancelled=[authLanding.error,authLanding.errorCode].includes('access_denied');
            restoreChecks(attempt);discardAttempt();
            showMsg(flowText(cancelled?'cancel':'failed'),cancelled?'info':'error');
            return;
        }
        if(initialized.error)throw initialized.error;
        if(hasCallback){
            const unclaimedCode=!directKakao&&authLanding.code&&new URLSearchParams(location.search).has('code');
            const remainingHash=new URLSearchParams(location.hash.slice(1));
            const unclaimedHash=authLanding.implicit&&(remainingHash.has('access_token')||remainingHash.has('refresh_token'));
            if(!attempt||unclaimedCode||unclaimedHash){
                restoreChecks(attempt);discardAttempt();showMsg(flowText('expired'));return;
            }
            const user=directKakao?await exchangeKakao(authLanding.code):(await getSession())?.user;
            if(!user)throw new Error('missing_session');
            const expected=directKakao?'kakao':'google';
            if(!user.identities?.some(i=>i.provider===expected)&&user.app_metadata?.provider!==expected){
                throw new Error('unexpected_provider');
            }
            confirmed=true;
            sessionStorage.setItem(CONSENT_STORAGE_KEY,JSON.stringify({...attempt,provider:expected,
                state:null,userId:user.id,boundAt:Date.now(),returnTo:returnTarget}));
            switchAccount=false;
            history.replaceState(null,'',authUrl().href);
        }else if(entryParams.get('verified')==='1')showMsg(T('emailVerifiedBanner'),'success');
        if(!switchAccount)await finishSession();
        else showAuth();
        acceptSessionEvents=true;
        onAuthChange((event,session)=>{
            if(event==='SIGNED_OUT'){
                displayedId=null;clearMsg();showAuth();
            }else if(event==='SIGNED_IN'&&session?.user&&!switchAccount&&displayedId!==session.user.id&&!authBusy){
                // Leave the Supabase auth lock before requesting the profile or recording consent.
                setTimeout(()=>{if(acceptSessionEvents&&!settling&&!authBusy)finishSession();},0);
            }
        });
    }catch(_){
        if(hasCallback&&!confirmed){
            restoreChecks(readAttempt());discardAttempt();showAuth();showMsg(flowText('failed'));
        }else showRetry();
    }finally{
        if(hasCallback){
            history.replaceState(null,'',authUrl().href);
            authLanding.code=null;
        }
        refreshBrowserLink();setBusy(!document.getElementById('retryAuth').hidden);startAnalytics();
    }
}

window.addEventListener('pageshow',event=>{
    if(!event.persisted)return;
    const pending=readAttempt();
    if(authBusy&&!hasCallback&&!pending?.userId&&document.getElementById('retryAuth').hidden){
        restoreChecks(pending);discardAttempt();setBusy(false);showMsg(flowText('cancel'),'info');
    }
});
init();
    </script>
